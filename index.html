<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneMusic</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --accent: #0284c7;
            --accent-light: #e0f2fe;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --fav-red: #f43f5e;
            --green: #10b981;
            --purple: #7c3aed;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            z-index: 20;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 3px 4px 3px 14px;
            flex: 1;
            max-width: 460px;
            min-width: 0;
            transition: all 0.2s;
        }
        .search-bar:focus-within {
            background: #ffffff;
            box-shadow: 0 0 0 3px var(--accent-glow);
            border-color: var(--accent);
        }

        .search-input {
            flex: 1;
            min-width: 0;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 6px 6px 0;
            font-size: 0.86rem;
            outline: none;
        }

        .search-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .market-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            width: 100%;
        }
        .market-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 1;
            min-width: 68px;
            text-align: center;
            background: #ffffff;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 6px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .tab-btn.fav-tab.active {
            background: var(--fav-red);
            color: #ffffff;
            border-color: var(--fav-red);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px 120px 16px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .banner-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #fff1f2 100%);
            border: 1px solid #bae6fd;
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
        }

        .banner-info h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .banner-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }

        .sub-source-select {
            background: #ffffff;
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .play-all-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        .cloud-wrap {
            position: relative;
            display: none;
        }

        .cloud-trigger-btn {
            background: #ffffff;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 13px;
            border-radius: 9px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .cloud-trigger-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: all 0.2s;
        }

        .cloud-trigger-btn.connected {
            color: var(--green);
            border-color: var(--green);
            background: #ecfdf5;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.28);
        }

        .cloud-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            z-index: 50;
            width: 136px;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .cloud-dropdown.open {
            display: flex;
        }

        .cloud-row-btn {
            width: 100%;
            padding: 11px 14px;
            background: #ffffff;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cloud-row-btn:last-of-type {
            border-bottom: none;
        }
        .cloud-row-btn:hover:not(:disabled) {
            background: #f1f5f9;
        }
        .cloud-row-btn:disabled {
            color: #cbd5e1;
            cursor: not-allowed;
            background: #ffffff;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s;
        }

        .song-item:hover {
            background: var(--bg-card-hover);
        }

        .song-item.active {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .song-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .rank {
            width: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        .meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            flex: 1;
        }

        .title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            font-size: 0.76rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .badge {
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: #f0f9ff;
            color: var(--accent);
            border: 1px solid #bae6fd;
        }

        .badge.full-verified {
            color: var(--green);
            border-color: #a7f3d0;
            background: #ecfdf5;
        }

        .fav-btn {
            background: transparent;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            line-height: 1;
            padding: 6px;
            border-radius: 50%;
            color: var(--text-secondary);
            transition: transform 0.15s;
        }
        .fav-btn:hover { transform: scale(1.18); }

        /* 底部播放栏 */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px 12px 16px;
            z-index: 35;
            box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.05);
        }

        .player-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #cbd5e1;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent-glow);
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .np-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
            cursor: pointer;
        }

        .np-cover {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            background: #e2e8f0;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .np-meta {
            min-width: 0;
            flex: 1;
        }

        .np-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-lyric-mini {
            font-size: 0.75rem;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .np-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .dsp-btn {
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            color: var(--purple);
            height: 36px;
            padding: 0 11px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .dsp-btn.active {
            background: linear-gradient(135deg, #7c3aed, #0284c7);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 3px 12px rgba(124, 58, 237, 0.3);
        }

        .ctrl-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .ctrl-btn:hover {
            background: #e2e8f0;
        }

        .ctrl-btn.lyric-toggle {
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--accent);
            border-color: #bae6fd;
            background: #f0f9ff;
        }

        .play-pause-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: transform 0.15s ease, background 0.2s ease;
            padding: 0;
        }
        .play-pause-circle:active {
            transform: scale(0.93);
        }
        .play-pause-circle svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            display: block;
        }

        /* 歌词抽屉视图 */
        .lyric-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 32;
            display: none;
            flex-direction: column;
            padding: 20px 24px 110px 24px;
            animation: fadeIn 0.2s ease;
        }
        .lyric-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lyric-header {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lyric-close-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .lyric-body {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 36px;
            align-items: center;
            overflow: hidden;
        }

        .lyric-art-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
        }

        .lyric-big-cover {
            width: 240px;
            height: 240px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            border: 1px solid var(--border-color);
        }

        .lyric-song-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .lyric-song-artist {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .lyric-scroll-col {
            height: 100%;
            overflow-y: auto;
            padding: 120px 12px;
            scroll-behavior: smooth;
            text-align: center;
            scrollbar-width: none;
        }
        .lyric-scroll-col::-webkit-scrollbar { display: none; }

        .lyric-line {
            padding: 10px 8px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: all 0.25s ease;
            cursor: pointer;
            border-radius: 8px;
            line-height: 1.6;
        }
        .lyric-line:hover {
            background: #f1f5f9;
        }
        .lyric-line.active {
            font-size: 1.18rem;
            font-weight: 700;
            color: var(--accent);
            transform: scale(1.03);
        }

        /* 云链接配置弹窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-mask.open {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-card h3 {
            font-size: 1.02rem;
            font-weight: 700;
        }

        .repo-grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 76px;
            gap: 8px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .form-group input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.84rem;
            outline: none;
            background: #ffffff;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            header { padding: 10px 12px; }
            .brand-title { font-size: 1.2rem; }
            .search-bar { padding: 2px 3px 2px 12px; }
            .search-btn { padding: 6px 13px; font-size: 0.78rem; }
            main { padding: 12px 12px 115px 12px; }
            .badge { display: none; }
            .dsp-btn { padding: 0 8px; font-size: 0.7rem; }
            .lyric-body {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .lyric-art-col {
                flex-direction: row;
                text-align: left;
                background: #f8fafc;
                padding: 10px 12px;
                border-radius: 12px;
                border: 1px solid var(--border-color);
            }
            .lyric-big-cover {
                width: 52px;
                height: 52px;
                border-radius: 10px;
            }
            .lyric-scroll-col {
                padding: 70px 6px;
            }
            .repo-grid-row {
                grid-template-columns: 1fr 1fr 68px;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-title">OneMusic</div>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索歌名或歌手..." onkeydown="if(event.key==='Enter') doAggregatedSearch()">
                    <button class="search-btn" onclick="doAggregatedSearch()">搜索</button>
                </div>
            </div>

            <div class="market-nav">
                <button class="tab-btn active" id="tab-cn" onclick="switchTab('cn')">🇨🇳 华语榜</button>
                <button class="tab-btn" id="tab-jp" onclick="switchTab('jp')">🇯🇵 日语榜</button>
                <button class="tab-btn" id="tab-bb" onclick="switchTab('bb')">🇺🇸 欧美榜</button>
                <button class="tab-btn fav-tab" id="tab-fav" onclick="switchTab('fav')">❤️ 收藏 (<span id="favCount">0</span>)</button>
                <button class="tab-btn" id="tab-search" style="display:none;" onclick="switchTab('search')">🔍 结果</button>
            </div>
        </div>
    </header>

    <main>
        <div class="banner-card">
            <div class="banner-info">
                <h2 id="bannerTitle">华语榜</h2>
            </div>
            <div class="banner-actions">
                <!-- 华语权威榜单：每个榜单拥有独立曲库，绝不重复混同 -->
                <select id="cnBoardSelect" class="sub-source-select" onchange="changeCnChart()">
                    <option value="meting_hot">原生 Meting · 华语热歌榜</option>
                    <option value="apple_tw">Apple Music · 台湾流行榜</option>
                    <option value="apple_hk">Apple Music · 香港粤语/流行榜</option>
                    <option value="apple_sg">Apple Music · 新加坡华语榜</option>
                    <option value="apple_cn">Apple Music · 中国大陆流行榜</option>
                    <option value="top_hktw">中国 TOP 排行榜 · 港台榜</option>
                    <option value="top_mainland">中国 TOP 排行榜 · 内地榜</option>
                </select>

                <!-- 欧美榜切换 -->
                <select id="bbBoardSelect" class="sub-source-select" style="display:none;" onchange="changeBillboardChart()">
                    <option value="60198">Billboard 公告牌周榜</option>
                    <option value="2809513713">欧美热歌全量榜</option>

    <script>
        const METING_ENDPOINTS = [

        const MIN_VALID_DURATION = 65;

            jp: { title: "日语榜", playlistId: "60131" },

        const SVG_PLAY_PATH = `<path d="M8.5 6.8c0-1.1 1.2-1.8 2.1-1.2l8.1 5.2c.9.6.9 1.8 0 2.4l-8.1 5.2c-.9.6-2.1-.1-2.1-1.2V6.8z"/>`;
        const SVG_PAUSE_PATH = `<rect x="7" y="6" width="3.6" height="12" rx="1.8"/><rect x="13.4" y="6" width="3.6" height="12" rx="1.8"/>`;

        const FAV_STORAGE_KEY = "ONEMUSIC_FAVORITES_V1";
        const CLOUD_CFG_KEY = "ONEMUSIC_CLOUD_CLEAN_V3";
        const CLOUD_JSON_FILE = "favorites.json";

        let currentTab = 'cn';
        let viewList = [];
        let playingQueue = [];
        let playingIndex = -1;
        let currentPlayingSong = null;

        let searchResults = [];
        let favorites = [];
        let activePlayToken = 0;
        let activeWorkingChain = null;

        let isCloudConnected = false;
        let hasCloudDownloadedAndMerged = false;

        let currentLyrics = [];
        let activeLyricIndex = -1;

        const audioDsp = document.getElementById('audioDsp');
        const audioRaw = document.getElementById('audioRaw');
        let activeAudio = audioDsp;

        const songListEl = document.getElementById('songList');
        const npCover = document.getElementById('npCover');
        const npTitle = document.getElementById('npTitle');
        const npStatus = document.getElementById('npStatus');
        const playIconSvg = document.getElementById('playIconSvg');
        const npFavBtn = document.getElementById('npFavBtn');
        const progressBar = document.getElementById('progressBar');

        const durTimeEl = document.getElementById('durTime');

        /* ================= 30Hz切底噪 + 电子管暖声 + 3D声场拓宽滤镜引擎 ================= */
        const DSP_PRESETS = [
            {
                key: 'tube_3d',
                label: '🎛️ 胆机3D母带',
                hpFreq: 32,
                low65: 4.2,
                mud250: -1.8,
                vocal3k: 2.2,
                air12k: 3.6,
                tubeDrive: 0.24,
                stereoWidth: 0.36
            },
            {
                key: 'warm_vocal',
                label: '🎛️ 胆机暖人声',
                hpFreq: 35,
                low65: 2.0,
                mud250: -2.4,
                vocal3k: 3.8,
                air12k: 2.8,
                tubeDrive: 0.32,
                stereoWidth: 0.22
            },
            {
                key: 'wide_bass',
                label: '🎛️ 3D超重低音',
                hpFreq: 30,
                low65: 6.5,
                mud250: -2.0,
                vocal3k: 1.2,
                air12k: 3.0,
                tubeDrive: 0.20,
                stereoWidth: 0.48
            },
            {
                key: 'direct',
                label: '🎛️ 原声直通',
                hpFreq: 20,
                low65: 0,
                mud250: 0,
                vocal3k: 0,
                air12k: 0,
                tubeDrive: 0,
                stereoWidth: 0
            }
        ];

        let dspPresetIndex = 0;
        let audioCtx = null;
        let dspNodes = null;

        function makeTubeWarmthCurve(driveAmount) {
            const n = 8192;
            const curve = new Float32Array(n);
            if (!driveAmount || driveAmount <= 0.001) {
                for (let i = 0; i < n; i++) {
                    curve[i] = (i * 2) / n - 1;
                }
                return curve;
            }
            const k = driveAmount * 2.6;
            const asym = driveAmount * 0.09;
            const norm = Math.tanh(k);
            for (let i = 0; i < n; i++) {
                const x = (i * 2) / n - 1;
                const evenHarmonic = asym * (x * x - 0.35);
                curve[i] = Math.tanh(k * x) / norm + evenHarmonic * (1 - Math.abs(x));
            }
            return curve;
        }

        function ensureWebAudioDSP() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return;
            }
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new Ctx();
                const source = audioCtx.createMediaElementSource(audioDsp);

                const subsonicHP = audioCtx.createBiquadFilter();
                subsonicHP.type = 'highpass';
                subsonicHP.frequency.value = 32;
                subsonicHP.Q.value = 0.707;

                const lowShelf65 = audioCtx.createBiquadFilter();
                lowShelf65.type = 'lowshelf';
                lowShelf65.frequency.value = 65;

                const mudCut250 = audioCtx.createBiquadFilter();
                mudCut250.type = 'peaking';
                mudCut250.frequency.value = 250;
                mudCut250.Q.value = 1.2;

                const vocalPeak3k = audioCtx.createBiquadFilter();
                vocalPeak3k.type = 'peaking';
                vocalPeak3k.frequency.value = 3200;
                vocalPeak3k.Q.value = 1.0;

                const airShelf12k = audioCtx.createBiquadFilter();
                airShelf12k.type = 'highshelf';
                airShelf12k.frequency.value = 12000;

                const tubeShaper = audioCtx.createWaveShaper();
                tubeShaper.oversample = '4x';

                const splitter = audioCtx.createChannelSplitter(2);
                const merger = audioCtx.createChannelMerger(2);

                const dryGainL = audioCtx.createGain();
                const dryGainR = audioCtx.createGain();

                const sideHPFilterL = audioCtx.createBiquadFilter();
                sideHPFilterL.type = 'highpass';
                sideHPFilterL.frequency.value = 220;

                const sideHPFilterR = audioCtx.createBiquadFilter();
                sideHPFilterR.type = 'highpass';
                sideHPFilterR.frequency.value = 220;

                const haasDelayL = audioCtx.createDelay(0.05);
                haasDelayL.delayTime.value = 0.0085;
                const haasDelayR = audioCtx.createDelay(0.05);
                haasDelayR.delayTime.value = 0.0095;

                const crossFeedLtoR = audioCtx.createGain();
                const crossFeedRtoL = audioCtx.createGain();

                const compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.value = -15;
                compressor.knee.value = 18;
                compressor.ratio.value = 2.6;
                compressor.attack.value = 0.006;
                compressor.release.value = 0.18;

                const makeupGain = audioCtx.createGain();
                makeupGain.gain.value = 1.05;

                source.connect(subsonicHP);
                subsonicHP.connect(lowShelf65);
                lowShelf65.connect(mudCut250);
                mudCut250.connect(vocalPeak3k);
                vocalPeak3k.connect(airShelf12k);
                airShelf12k.connect(tubeShaper);

                tubeShaper.connect(splitter);

                splitter.connect(dryGainL, 0);
                splitter.connect(dryGainR, 1);
                dryGainL.connect(merger, 0, 0);
                dryGainR.connect(merger, 0, 1);

                splitter.connect(sideHPFilterL, 0);
                sideHPFilterL.connect(haasDelayL);
                haasDelayL.connect(crossFeedLtoR);
                crossFeedLtoR.connect(merger, 0, 1);

                splitter.connect(sideHPFilterR, 1);
                sideHPFilterR.connect(haasDelayR);
                haasDelayR.connect(crossFeedRtoL);
                crossFeedRtoL.connect(merger, 0, 0);

                merger.connect(compressor);
                compressor.connect(makeupGain);
                makeupGain.connect(audioCtx.destination);

                dspNodes = {
                    subsonicHP,
                    lowShelf65,
                    mudCut250,
                    vocalPeak3k,
                    airShelf12k,
                    tubeShaper,
                    crossFeedLtoR,
                    crossFeedRtoL,
                    makeupGain
                };

                applyDspPreset();
            } catch (e) {
                console.warn("WebAudio DSP 初始化受限:", e);
            }
        }

        function applyDspPreset() {
            const preset = DSP_PRESETS[dspPresetIndex];
            const btn = document.getElementById('dspBtn');
            if (btn) {
                btn.innerText = preset.label;
                btn.classList.toggle('active', preset.key !== 'direct');
            }
            if (!dspNodes) return;

            dspNodes.subsonicHP.frequency.value = preset.hpFreq;
            dspNodes.lowShelf65.gain.value = preset.low65;
            dspNodes.mudCut250.gain.value = preset.mud250;
            dspNodes.vocal3k = preset.vocal3k;
            dspNodes.vocalPeak3k.gain.value = preset.vocal3k;
            dspNodes.airShelf12k.gain.value = preset.air12k;
            dspNodes.tubeShaper.curve = makeTubeWarmthCurve(preset.tubeDrive);

            dspNodes.crossFeedLtoR.gain.value = -preset.stereoWidth;
            dspNodes.crossFeedRtoL.gain.value = -preset.stereoWidth;
            dspNodes.makeupGain.gain.value = preset.key === 'direct' ? 1.0 : 1.06;
        }

        function cycleDspPreset() {
            ensureWebAudioDSP();
            dspPresetIndex = (dspPresetIndex + 1) % DSP_PRESETS.length;
            applyDspPreset();
        }

        function setPlayButtonVisual(isPlaying) {
            playIconSvg.innerHTML = isPlaying ? SVG_PAUSE_PATH : SVG_PLAY_PATH;
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
            }
        }

        async function requestMeting(paramsStr, timeout = 5500) {
            for (let endpoint of METING_ENDPOINTS) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                try {
                    const res = await fetch(`${endpoint}?${paramsStr}`, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) return data;
                } catch (e) {
                    clearTimeout(timer);
                }
            }
            return [];
        }

        async function searchGDStudio(keyword) {
            const sources = ['kuwo', 'tencent', 'kugou'];
            const results = [];
            const tasks = sources.map(async (srv) => {
                try {
                    const res = await fetch(`https://music-api.gdstudio.xyz/api.php?types=search&source=${srv}&name=${encodeURIComponent(keyword)}&count=2`);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const first = data[0];
                        const urlRes = await fetch(`https://music-api.gdstudio.xyz/api.php?types=url&source=${srv}&id=${first.id}&br=320`);
                        const urlData = await urlRes.json();
                        if (urlData && urlData.url) {
                            results.push({
                                url: urlData.url,
                                label: `GD-${srv.toUpperCase()}·320k`,
                                lyricId: first.lyric_id || first.id,
                                srv: srv
                            });
                        }
                    }
                } catch (e) {}
            });
            await Promise.allSettled(tasks);
            return results;
        }

        /* ================= 收藏与云同步模块 ================= */
        function loadFavorites() {
            try {
                const raw = localStorage.getItem(FAV_STORAGE_KEY) || localStorage.getItem("MUSIC_HUB_FAVORITES_V5");
                favorites = raw ? JSON.parse(raw) : [];
            } catch (e) {
                favorites = [];
            }
            updateFavCountUI();
        }

        function saveFavorites() {
            localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favorites));
            updateFavCountUI();
        }

        function updateFavCountUI() {
            document.getElementById('favCount').innerText = favorites.length;
            if (currentPlayingSong) {
                const liked = isSongFavorited(currentPlayingSong);
                npFavBtn.innerText = liked ? "❤️" : "🤍";
            } else {
                npFavBtn.innerText = "🤍";
            }
        }

        function getSongFingerprint(title, artist) {
            const cleanTitle = (title || '').replace(/\(.*?\)|（.*?）|\[.*?\]/g, '').trim().toLowerCase();
            const cleanArtist = (artist || '').split(/[\/&,、]/)[0].trim().toLowerCase();
            return `${cleanTitle}__${cleanArtist}`;
        }

        function isSongFavorited(song) {
            if (!song) return false;
            const fp = getSongFingerprint(song.title, song.artist);
            return favorites.some(f => getSongFingerprint(f.title, f.artist) === fp);
        }

        function isSameSong(songA, songB) {
            if (!songA || !songB) return false;
            return getSongFingerprint(songA.title, songA.artist) === getSongFingerprint(songB.title, songB.artist);
        }

        function toggleFavorite(song, event) {
            if (event) event.stopPropagation();
            if (!song) return;

            const fp = getSongFingerprint(song.title, song.artist);
            const idx = favorites.findIndex(f => getSongFingerprint(f.title, f.artist) === fp);

            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                let lockedSources = song.sources || [];
                if (currentPlayingSong && isSameSong(currentPlayingSong, song)) {
                    if (activeWorkingChain) {
                        lockedSources = [activeWorkingChain];
                    } else if (activeAudio.src) {
                        lockedSources = [{ url: activeAudio.src, label: "直连链" }];
                    }
                }
                favorites.unshift({
                    title: song.title,
                    artist: song.artist,
                    cover: song.cover,
                    sources: lockedSources.map(s => ({ url: s.url, label: s.label })),
                    badgeText: lockedSources.length > 0 ? `⚡ 锁定(${lockedSources[0].label})` : '已收藏',
                    verifiedFull: true
                });
            }
            saveFavorites();
            if (currentTab === 'fav') {
                viewList = [...favorites];
            }
            renderList();
        }

        function toggleCurrentFav() {
            if (currentPlayingSong) {
                toggleFavorite(currentPlayingSong);
            }
        }

        function getCloudConfig() {
            try {
                const cfg = JSON.parse(localStorage.getItem(CLOUD_CFG_KEY));
                if (cfg && typeof cfg === 'object') return cfg;
            } catch (e) {}
            return { owner: '', repoName: '', branch: '', token: '' };

        function openCloudConfigModal() {
            document.getElementById('cloudDropdown').classList.remove('open');
            const cfg = getCloudConfig();
            document.getElementById('cfgOwner').value = cfg.owner || '';
            document.getElementById('cfgRepoName').value = cfg.repoName || '';

            document.getElementById('cloudModal').classList.add('open');

        function closeCloudConfigModal() {

        }

        async function saveCloudConfig() {
            const owner = document.getElementById('cfgOwner').value.trim();
            const repoName = document.getElementById('cfgRepoName').value.trim();
            const branch = document.getElementById('cfgBranch').value.trim() || 'main';
            const token = document.getElementById('cfgToken').value.trim();

            if (!owner || !repoName) {
                alert('请手工填写用户名和仓库名');
                return;
            }

            localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({ owner, repoName, branch, token }));
            closeCloudConfigModal();
            await cloudDownloadAndMerge();
        }

        async function cloudDownloadAndMerge() {
            document.getElementById('cloudDropdown').classList.remove('open');
            const cfg = getCloudConfig();
            if (!cfg.owner || !cfg.repoName) {
                openCloudConfigModal();
                return;
            }

            const branch = cfg.branch || 'main';
            npStatus.innerText = "正在拉取云端配置...";

            try {
                const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repoName}/contents/${CLOUD_JSON_FILE}?ref=${encodeURIComponent(branch)}`;
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (cfg.token) headers['Authorization'] = `token ${cfg.token}`;

                const res = await fetch(apiUrl, { headers, cache: 'no-store' });
                let remoteList = [];

                if (res.status === 200) {
                    const data = await res.json();
                    const jsonStr = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
                    const parsed = JSON.parse(jsonStr);
                    if (Array.isArray(parsed)) remoteList = parsed;
                } else if (res.status === 404) {
                    const repoRes = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repoName}`, { headers, cache: 'no-store' });
                    if (!repoRes.ok) throw new Error(`找不到公开仓库 ${cfg.owner}/${cfg.repoName}`);
                    remoteList = [];
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }

                const mergedMap = new Map();
                [...favorites, ...remoteList].forEach(item => {
                    if (!item || !item.title) return;
                    const fp = getSongFingerprint(item.title, item.artist);
                    if (!mergedMap.has(fp)) {

        async function cloudUploadJson() {
            document.getElementById('cloudDropdown').classList.remove('open');

            if (!hasCloudDownloadedAndMerged) {
                alert("请先点击「云下行」整合本地数据后，再执行云上传。");
                return;
            }

            const cfg = getCloudConfig();
            if (!cfg.owner || !cfg.repoName) {
                openCloudConfigModal();
                return;
            }

            const branch = cfg.branch || 'main';
            npStatus.innerText = "⬆️ 正在上传至公开仓...";

            try {
                const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repoName}/contents/${CLOUD_JSON_FILE}`;
                const headers = {
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };
                if (cfg.token) {
                    headers['Authorization'] = `token ${cfg.token}`;
                }

                let sha = undefined;
                const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers, cache: 'no-store' });
                if (getRes.status === 200) {
                    const getJson = await getRes.json();
                    sha = getJson.sha;
                }

                const cleanPayload = favorites.map(f => ({
                    title: f.title,
                    artist: f.artist,
                    cover: f.cover,
                    sources: (f.sources || []).map(s => ({ url: s.url, label: s.label })),
                    badgeText: f.badgeText
                }));

                const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(cleanPayload, null, 2))));
                const body = {
                    message: `Sync OneMusic favorites (${cleanPayload.length} songs)`,
                    content: contentBase64,
                    branch: branch
                };
                if (sha) body.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(body)
                });

                if (!putRes.ok) {
                    const errData = await putRes.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${putRes.status}`);
                }

                setCloudLightStatus(true);
                npStatus.innerText = `🎉 云上传成功 (${cleanPayload.length} 首)`;
                alert(`云上传成功！已同步 ${cleanPayload.length} 首收藏配置至 ${cfg.owner}/${cfg.repoName}`);
            } catch (err) {
                npStatus.innerText = `❌ 云上传失败`;
                alert(`云上传失败：${err.message}`);
            }
        }

        function parseLrc(lrcText) {
            if (!lrcText || typeof lrcText !== 'string') return [];
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;

            for (let line of lines) {
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;
                let match;
                timeReg.lastIndex = 0;
                while ((match = timeReg.exec(line)) !== null) {
                    const min = parseInt(match[1], 10);
                    const sec = parseInt(match[2], 10);
                    const ms = parseInt(match[3], 10) / (match[3].length === 3 ? 1000 : 100);
                    result.push({ time: min * 60 + sec + ms, text });
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }

        async function fetchLyricsForSong(song, token) {
            currentLyrics = [];
            activeLyricIndex = -1;
            renderLyricsDOM([{ time: 0, text: `正在加载《${song.title}》歌词...` }]);

            const cleanTitle = song.title.replace(/\(.*?\)|（.*?）/g, '').trim();
            const cleanArtist = song.artist.split(/[\/&,、]/)[0].trim();
            const query = `${cleanTitle} ${cleanArtist}`.trim();

            try {
                const list = await requestMeting(`server=netease&type=search&id=${encodeURIComponent(query)}`, 4500);
                if (token !== activePlayToken) return;

                if (Array.isArray(list) && list.length > 0 && list[0].lrc) {
                    const res = await fetch(list[0].lrc);
                    const lrcStr = await res.text();
                    const parsed = parseLrc(lrcStr);
                    if (parsed.length > 0) {
                        currentLyrics = parsed;
                        renderLyricsDOM(currentLyrics);
                        return;
                    }
                }

                const lrcLibRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                if (lrcLibRes.ok) {
                    const lrcArr = await lrcLibRes.json();
                    if (Array.isArray(lrcArr) && lrcArr.length > 0 && lrcArr[0].syncedLyrics) {
                        const parsed = parseLrc(lrcArr[0].syncedLyrics);
                        if (parsed.length > 0) {
                            currentLyrics = parsed;
                            renderLyricsDOM(currentLyrics);
                            return;
                        }
                    }
                }
            } catch (e) {}

            if (token === activePlayToken && currentLyrics.length === 0) {
                renderLyricsDOM([
                    { time: 0, text: `${song.title} - ${song.artist}` },
                    { time: 2, text: "纯音乐或暂无时间轴歌词" }
                ]);
            }
        }

        function renderLyricsDOM(lines) {
            const box = document.getElementById('lyricScrollBox');
            box.innerHTML = '';
            lines.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `lyric-line ${idx === 0 ? 'active' : ''}`;
                div.innerText = item.text;
                div.onclick = () => {
                    if (activeAudio.duration && item.time >= 0) {
                        activeAudio.currentTime = item.time;
                    }
                };
                box.appendChild(div);
            });
        }

        function syncLyricProgress(currentTime) {
            if (!currentLyrics.length) return;
            let idx = 0;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) {
                    idx = i;
                } else {
                    break;
                }
            }
            if (idx !== activeLyricIndex) {
                activeLyricIndex = idx;
                const box = document.getElementById('lyricScrollBox');
                const nodes = box.querySelectorAll('.lyric-line');
                nodes.forEach((n, i) => n.classList.toggle('active', i === idx));
                if (nodes[idx]) {
                    nodes[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                if (currentLyrics[idx]) {
                    npStatus.innerText = `♪ ${currentLyrics[idx].text}`;
                }
            }
        }

        /* ================= 修复版 Apple 各区独立采样器（绝不混同兜底） ================= */
        async function fetchAppleRegionalChart(region, badgeLabel) {
            // 通道 1：对于 tw / hk / sg / us，优先请求原生支持 CORS 的 iTunes Store Top Songs RSS
            if (region !== 'cn') {
                try {
                    const iTunesUrl = `https://itunes.apple.com/${region}/rss/topsongs/limit=45/json`;
                    const res = await fetch(iTunesUrl);
                    if (res.ok) {
                        const json = await res.json();
                        const entries = (json && json.feed && json.feed.entry) || [];
                        if (Array.isArray(entries) && entries.length > 0) {
                            return entries.map(item => {
                                const imgs = item['im:image'] || [];
                                const rawCover = imgs.length ? imgs[imgs.length - 1].label : "https://picsum.photos/seed/music/300/300";
                                return {
                                    title: item['im:name'] ? item['im:name'].label : "未知歌曲",
                                    artist: item['im:artist'] ? item['im:artist'].label : "未知歌手",
                                    cover: rawCover.replace(/170x170/g, '300x300'),
                                    sources: [],
                                    badgeText: badgeLabel
                                };
                            });
                        }
                    }
                } catch (e) {}
            }

            // 通道 2：通过透明 CORS 代理拉取 Apple Music 官方实时流媒体榜（支持 cn / tw / hk / sg / us 全区）
            const appleRssTarget = `https://rss.applemarketingtools.com/api/v2/${region}/music/most-played/45/songs.json`;
            const proxyUrls = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(appleRssTarget)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(appleRssTarget)}`
            ];

            for (let pUrl of proxyUrls) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(pUrl, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!res.ok) continue;
                    const json = await res.json();
                    const results = json && json.feed && json.feed.results;
                    if (Array.isArray(results) && results.length > 0) {
                        return results.map(item => ({
                            title: item.name || "未知歌曲",
                            artist: item.artistName || "未知歌手",
                            cover: (item.artworkUrl100 || "https://picsum.photos/seed/music/300/300").replace(/100x100/g, '300x300'),
                            sources: [],
                            badgeText: badgeLabel
                        }));
                    }
                } catch (e) {}
            }

            // 通道 3：如果用户网络无法访问境外 Apple 接口，为不同地区映射各自完全独立的地区榜单 ID，绝不共用同一个 3778678！
            const regionalFallbackMap = {
                'tw': { id: '64016',      badge: '港台流行榜' },
                'hk': { id: '1978921795', badge: '香港粤语榜' },
                'sg': { id: '2809577409', badge: '新马华语榜' },
                'cn': { id: '112504',     badge: '中国内地榜' },
                'us': { id: '60198',      badge: '美国公告牌' }
            };
            const fb = regionalFallbackMap[region] || { id: '19723756', badge: badgeLabel };
            const data = await requestMeting(`server=netease&type=playlist&id=${fb.id}`);
            return data.slice(0, 45).map(item => ({
                title: item.name || item.title || "未知曲目",
                artist: item.artist || item.author || "未知歌手",
                cover: item.pic || "https://picsum.photos/seed/music/300/300",
                sources: [],
                badgeText: fb.badge
            }));
        }

        async function doAggregatedSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            document.getElementById('tab-search').style.display = 'inline-block';
            switchTab('search');

            songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--accent);">正在全网并发检索「${keyword}」...</div>`;

            const tasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(keyword)}`, 6000)
                    .then(list => ({ plat, list: list.slice(0, 15) }))
            );

            const settled = await Promise.allSettled(tasks);
            const mergedMap = new Map();

            settled.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    const { plat, list } = res.value;
                    list.forEach(item => {
                        const title = item.name || item.title || "未知歌曲";
                        const artist = item.artist || item.author || "未知歌手";
                        if (!item.url) return;

                        const fp = getSongFingerprint(title, artist);
                        if (!mergedMap.has(fp)) {
                            mergedMap.set(fp, {
                                title,
                                artist,
                                cover: item.pic || "https://picsum.photos/seed/music/300/300",
                                sources: [{ url: item.url, label: plat.label }],
                                labels: [plat.label]
                            });
                        } else {
                            const existing = mergedMap.get(fp);
                            if (!existing.labels.includes(plat.label)) {
                                existing.sources.push({ url: item.url, label: plat.label });
                                existing.labels.push(plat.label);
                            }
                            if (existing.cover.includes('picsum.photos') && item.pic) {
                                existing.cover = item.pic;
                            }
                        }
                    });
                }
            });

            searchResults = Array.from(mergedMap.values()).map(item => ({
                ...item,
                badgeText: `聚合 ${item.sources.length} 源`
            }));

            viewList = [...searchResults];
            renderList();

        async function playSongInQueue(idx) {
            if (!playingQueue[idx]) return;
            playingIndex = idx;
            const myToken = ++activePlayToken;
            const song = playingQueue[idx];
            currentPlayingSong = song;
            activeWorkingChain = null;

            renderList();
            npCover.src = song.cover;
            npTitle.innerText = `${song.title} - ${song.artist}`;
            document.getElementById('lyricCover').src = song.cover;
            document.getElementById('lyricTitle').innerText = song.title;
            document.getElementById('lyricArtist').innerText = song.artist;

            updateMediaSession(song);
            fetchLyricsForSong(song, myToken);

            const favMatch = favorites.find(f => isSameSong(f, song));
            const combinedSources = [
                ...(favMatch && favMatch.sources ? favMatch.sources : []),
                ...(song.sources || [])
            ];

            if (combinedSources.length > 0) {
                for (let srcObj of combinedSources) {
                    if (myToken !== activePlayToken) return;
                    npStatus.innerText = `⚡ 直连 [${srcObj.label}]...`;
                    const check = await verifyAndPlayStream(srcObj.url, myToken);
                    if (check.ok) {
                        song.verifiedFull = true;
                        activeWorkingChain = srcObj;
                        const dspTag = check.dspActive ? "胆机3D" : "320k直通";
                        song.badgeText = `⚡ ${dspTag} (${formatTime(check.duration)} · ${srcObj.label})`;
                        renderList();
                        npStatus.innerText = `⚡ ${dspTag} · ${formatTime(check.duration)} · ${srcObj.label}`;
                        updateMediaSession(song);
                        return;
                    }
                }
            }

            if (myToken !== activePlayToken) return;

            npStatus.innerText = `正在穿透采集 320k 音源...`;
            const cleanTitle = song.title.replace(/\(.*?\)|（.*?）/g, '').trim();
            const cleanArtist = song.artist.split(/[\/&,、]/)[0].trim();
            const query = `${cleanTitle} ${cleanArtist}`.trim();

            const metingTasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(query)}`, 5000)
                    .then(list => ({ plat, list }))
            );
            const gdTask = searchGDStudio(query);

            const [settledMeting, gdSources] = await Promise.all([
                Promise.allSettled(metingTasks),
                gdTask
            ]);

            if (myToken !== activePlayToken) return;

            // 构建穿透候选池：酷我/GD第一，B站固定第二，其余依次递推
            const primaryNonBili = [];
            const biliCandidates = [];
            const otherCandidates = [];

            if (gdSources.length > 0) {
                primaryNonBili.push(gdSources[0]);
            }

            settledMeting.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    const isBili = res.value.plat.code === 'bilibili';
                    res.value.list.slice(0, 2).forEach(match => {
                        if (match && match.url) {
                            const item = {
                                url: match.url,
                                label: res.value.plat.label,
                                pic: match.pic
                            };
                            if (isBili) {
                                biliCandidates.push(item);
                            } else if (primaryNonBili.length === 0) {
                                primaryNonBili.push(item);
                            } else {
                                otherCandidates.push(item);
                            }
                        }
                    });
                }
            });

            const candidatePool = [
                ...primaryNonBili,
                ...biliCandidates,
                ...gdSources.slice(1),
                ...otherCandidates
            ];

            for (let cand of candidatePool) {
                if (myToken !== activePlayToken) return;
                npStatus.innerText = `校验 [${cand.label}]...`;
                const check = await verifyAndPlayStream(cand.url, myToken);

                if (check.ok) {
                    song.sources = [{ url: cand.url, label: cand.label }];
                    song.verifiedFull = true;
                    activeWorkingChain = cand;
                    const dspTag = check.dspActive ? "胆机3D" : "320k直通";
                    song.badgeText = `✓ ${dspTag} (${formatTime(check.duration)} · ${cand.label})`;
                    if (cand.pic && song.cover.includes('picsum.photos')) {
                        song.cover = cand.pic;
                        npCover.src = cand.pic;
                        document.getElementById('lyricCover').src = cand.pic;
                    }
                    renderList();
                    npStatus.innerText = `✓ ${dspTag} · ${formatTime(check.duration)} · ${cand.label}`;
                    updateMediaSession(song);
                    return;
                }
            }

            if (myToken === activePlayToken) {
                song.badgeText = "⚠️ 暂无音源";
                renderList();
                npStatus.innerText = `未找到可用完整版音频，自动切歌...`;
                setTimeout(() => { if (myToken === activePlayToken) nextSong(); }, 1200);
            }
        }

        function attemptSingleAudioElement(el, url, token, timeoutMs = 4500) {
            return new Promise((resolve) => {
                let settled = false;
                const finish = (res) => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve(res);
                };

                const timer = setTimeout(() => finish({ ok: false, reason: 'timeout' }), timeoutMs);

                const onLoadedMetadata = () => {
                    if (token !== activePlayToken) return finish({ ok: false, reason: 'cancelled' });
                    const dur = el.duration;
                    if (dur && isFinite(dur) && dur <= MIN_VALID_DURATION) {
                        el.pause();
                        el.removeAttribute('src');
                        return finish({ ok: false, reason: 'trial_30s', duration: dur });
                    }
                    el.play().then(() => {
                        finish({ ok: true, duration: dur || 200 });
                    }).catch(() => finish({ ok: false, reason: 'play_error' }));
                };

                const onError = () => finish({ ok: false, reason: 'cors_or_network_error' });

                const cleanup = () => {
                    clearTimeout(timer);
                    el.removeEventListener('loadedmetadata', onLoadedMetadata);
                    el.removeEventListener('error', onError);
                };

                el.pause();
                el.addEventListener('loadedmetadata', onLoadedMetadata, { once: true });
                el.addEventListener('error', onError, { once: true });
                el.src = url;
                el.load();
            });
        }

        async function verifyAndPlayStream(url, token) {
            if (!url) return { ok: false, reason: 'empty' };
            stopBothAudios();
            ensureWebAudioDSP();

            // 1. 优先尝试带 CORS 的 audioDsp（满血挂载 30Hz切底噪 + 电子管暖声 + 3D声场拓宽）
            const dspTry = await attemptSingleAudioElement(audioDsp, url, token, 3600);
            if (dspTry.ok) {
                activeAudio = audioDsp;
                setPlayButtonVisual(true);
                return { ok: true, duration: dspTry.duration, dspActive: true };
            }
            if (dspTry.reason === 'trial_30s' || dspTry.reason === 'cancelled') {
                return dspTry;
            }

            // 2. 若音源 CDN 未配置 CORS 头，无缝切换 audioRaw 320k 原生直通播放
            const rawTry = await attemptSingleAudioElement(audioRaw, url, token, 4500);
            if (rawTry.ok) {
                activeAudio = audioRaw;
                setPlayButtonVisual(true);
                return { ok: true, duration: rawTry.duration, dspActive: false };
            }
            return rawTry;
        }

        function togglePlay() {
            ensureWebAudioDSP();
            if (!currentPlayingSong && viewList.length > 0) {
                startPlayFromView(0);
                return;
            }
            if (activeAudio.paused) {
                activeAudio.play();
                setPlayButtonVisual(true);
            } else {
                activeAudio.pause();
                setPlayButtonVisual(false);
            }
        }

        function prevSong() {
            if (!playingQueue.length && viewList.length) {
                playingQueue = [...viewList];
                playingIndex = 0;
            }
            if (!playingQueue.length) return;
            playSongInQueue((playingIndex - 1 + playingQueue.length) % playingQueue.length);
        }

        function nextSong() {
            if (!playingQueue.length && viewList.length) {
                playingQueue = [...viewList];
                playingIndex = -1;
            }
            if (!playingQueue.length) return;
            playSongInQueue((playingIndex + 1) % playingQueue.length);
        }

        function setupHeadsetMediaSession() {
            if (!('mediaSession' in navigator)) return;

            const actionHandlers = [
                ['play', () => {
                    if (!currentPlayingSong && viewList.length > 0) {
                        startPlayFromView(0);
                    } else {
                        activeAudio.play();
                        setPlayButtonVisual(true);
                    }
                }],
                ['pause', () => {
                    activeAudio.pause();
                    setPlayButtonVisual(false);
                }],
                ['nexttrack', () => nextSong()],
                ['previoustrack', () => prevSong()],
                ['seekto', (details) => {
                    if (details.seekTime && activeAudio.duration) {
                        activeAudio.currentTime = details.seekTime;
                    }
                }]
            ];

            for (const [action, handler] of actionHandlers) {
                try {
                    navigator.mediaSession.setActionHandler(action, handler);
                } catch (e) {}
            }
        }

        function updateMediaSession(song) {
            if (!('mediaSession' in navigator) || !song) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: song.artist,
                album: 'OneMusic',
                artwork: [
                    { src: song.cover, sizes: '96x96', type: 'image/jpeg' },
                    { src: song.cover, sizes: '256x256', type: 'image/jpeg' },
                    { src: song.cover, sizes: '512x512', type: 'image/jpeg' }
                ]
            });
            setupHeadsetMediaSession();
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function bindAudioEvents(el) {
            el.addEventListener('timeupdate', () => {
                if (el !== activeAudio) return;
                if (el.duration && el.duration > MIN_VALID_DURATION) {
                    progressBar.value = (el.currentTime / el.duration) * 100;
                    curTimeEl.innerText = formatTime(el.currentTime);
                    durTimeEl.innerText = formatTime(el.duration);
                    syncLyricProgress(el.currentTime);

                    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                        try {
                            navigator.mediaSession.setPositionState({
                                duration: el.duration,
                                playbackRate: el.playbackRate || 1,
                                position: el.currentTime
                            });
                        } catch (e) {}
                    }
                }
            });

            el.addEventListener('pause', () => {
                if (el === activeAudio) setPlayButtonVisual(false);
            });
            el.addEventListener('play', () => {
                if (el === activeAudio) setPlayButtonVisual(true);
            });
            el.addEventListener('ended', () => {
                if (el === activeAudio) nextSong();
            });
        }

        bindAudioEvents(audioDsp);
        bindAudioEvents(audioRaw);

        progressBar.addEventListener('input', () => {
            if (activeAudio.duration) {
                activeAudio.currentTime = (progressBar.value / 100) * activeAudio.duration;
            }
        });

        setupHeadsetMediaSession();
        loadFavorites();
        switchTab('cn');
    </script>
</body>
</html>
