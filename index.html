<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Hub - 采集链直连秒播版</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-glass: rgba(19, 27, 46, 0.88);
            --bg-card: rgba(30, 41, 59, 0.55);
            --bg-card-hover: rgba(51, 65, 85, 0.8);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --fav-red: #f43f5e;
            --green: #10b981;
            --bili-pink: #fb7299;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at top right, #1e293b 0%, #090d16 65%);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            z-index: 20;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #fb7299, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(251, 114, 153, 0.3);
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .shield-tag {
            font-size: 0.72rem;
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-weight: 600;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 999px;
            padding: 4px 6px 4px 16px;
            flex: 1;
            max-width: 480px;
            min-width: 240px;
            transition: box-shadow 0.2s;
        }
        .search-bar:focus-within {
            box-shadow: 0 0 14px var(--accent-glow);
            border-color: var(--accent);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 8px;
            font-size: 0.86rem;
            outline: none;
        }

        .search-btn {
            background: var(--accent);
            color: #090d16;
            border: none;
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
        }

        .market-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .market-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 1;
            min-width: 105px;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #090d16;
            border-color: var(--accent);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .tab-btn.fav-tab.active {
            background: var(--fav-red);
            color: #fff;
            border-color: var(--fav-red);
            box-shadow: 0 4px 14px rgba(244, 63, 94, 0.4);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 115px 20px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .banner-card {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.14) 0%, rgba(251, 114, 153, 0.08) 100%);
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .banner-info h2 {
            font-size: 1.16rem;
            margin-bottom: 4px;
        }

        .banner-info p {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .banner-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .sub-source-select {
            background: rgba(15, 23, 42, 0.9);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.85);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.78rem;
            cursor: pointer;
        }

        .play-all-btn {
            background: var(--accent);
            color: #090d16;
            border: none;
            padding: 9px 16px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .song-item:hover {
            background: var(--bg-card-hover);
        }

        .song-item.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.12);
        }

        .song-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .rank {
            width: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #1e293b;
            flex-shrink: 0;
        }

        .meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            flex: 1;
        }

        .title {
            font-size: 0.92rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            font-size: 0.76rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .badge {
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.75);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .badge.full-verified {
            color: var(--green);
            border-color: rgba(16, 185, 129, 0.35);
            background: rgba(16, 185, 129, 0.1);
        }

        .fav-btn {
            background: transparent;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            line-height: 1;
            padding: 6px;
            border-radius: 50%;
            color: var(--text-secondary);
            transition: transform 0.15s, color 0.15s;
        }
        .fav-btn:hover { transform: scale(1.18); }
        .fav-btn.liked {
            color: var(--fav-red);
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 13, 22, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px 14px 20px;
            z-index: 30;
        }

        .player-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #334155;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .np-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .np-cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #1e293b;
            flex-shrink: 0;
        }

        .np-meta {
            min-width: 0;
            flex: 1;
        }

        .np-title {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-status {
            font-size: 0.72rem;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .ctrl-btn.play-pause {
            width: 42px;
            height: 42px;
            background: var(--accent);
            color: #090d16;
            font-weight: bold;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        @media (max-width: 640px) {
            header { padding: 10px 12px; }
            .search-bar { max-width: 100%; width: 100%; order: 3; }
            main { padding: 12px 12px 115px 12px; }
            .badge { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-logo">M</div>
                    <div class="brand-title">Music Hub</div>
                    <span class="shield-tag">⚡ 收藏夹直连秒播已启用</span>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="输入歌名/歌手，全网并发搜完整版..." onkeydown="if(event.key==='Enter') doAggregatedSearch()">
                    <button class="search-btn" onclick="doAggregatedSearch()">全网搜索</button>
                </div>
            </div>

            <div class="market-nav">
                <button class="tab-btn active" id="tab-cn" onclick="switchTab('cn')">🇨🇳 华语榜</button>
                <button class="tab-btn" id="tab-jp" onclick="switchTab('jp')">🇯🇵 日语榜 (Oricon)</button>
                <button class="tab-btn" id="tab-bb" onclick="switchTab('bb')">🇺🇸 Billboard 欧美</button>
                <button class="tab-btn fav-tab" id="tab-fav" onclick="switchTab('fav')">❤️ 我的收藏 (<span id="favCount">0</span>)</button>
                <button class="tab-btn" id="tab-search" style="display:none;" onclick="switchTab('search')">🔍 聚合结果</button>
            </div>
        </div>
    </header>

    <main>
        <div class="banner-card">
            <div class="banner-info">
                <h2 id="bannerTitle">华语市场 TOP 热歌榜</h2>
                <p id="bannerDesc">收藏时自动记录当时成功的采集链，播放收藏歌曲时直连秒播，免去重复穿透</p>
            </div>
            <div class="banner-actions">
                <select id="bbBoardSelect" class="sub-source-select" style="display:none;" onchange="changeBillboardChart()">
                    <option value="60198">Billboard 公告牌周榜</option>
                    <option value="2809513713">欧美热歌全量榜 (高完整率)</option>
                    <option value="180106">UK 英国官方单曲榜</option>
                    <option value="60131_apple">Apple Music 全球 Top 100</option>
                </select>
                <button class="action-btn" id="exportFavBtn" style="display:none;" onclick="exportFavorites()">导出备份</button>
                <button class="action-btn" id="importFavBtn" style="display:none;" onclick="importFavorites()">导入备份</button>
                <button class="play-all-btn" onclick="playSong(0)">▶ 全部连播</button>
            </div>
        </div>

        <div class="song-list" id="songList"></div>
    </main>

    <div class="player-bar">
        <div class="player-inner">
            <div class="progress-wrap">
                <span id="curTime">00:00</span>
                <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100" step="0.1">
                <span id="durTime">00:00</span>
            </div>
            <div class="player-main">
                <div class="np-left">
                    <img src="https://picsum.photos/seed/music/100/100" class="np-cover" id="npCover" alt="cover">
                    <div class="np-meta">
                        <div class="np-title" id="npTitle">点击任意歌曲开始播放</div>
                        <div class="np-status" id="npStatus">直连秒播引擎就绪</div>
                    </div>
                </div>
                <div class="np-controls">
                    <button class="fav-btn" id="npFavBtn" onclick="toggleCurrentFav()" title="收藏当前歌曲">🤍</button>
                    <button class="ctrl-btn" onclick="prevSong()" title="上一首">⏮</button>
                    <button class="ctrl-btn play-pause" id="playBtn" onclick="togglePlay()">▶</button>
                    <button class="ctrl-btn" onclick="nextSong()" title="下一首">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        const METING_ENDPOINTS = [
            "https://api.injahow.cn/meting/",
            "https://api.qijieya.cn/meting/",
            "https://api.i-meto.com/meting/api"
        ];

        const UPSTREAM_PLATFORMS = [
            { code: 'bilibili', label: 'B站音源' },
            { code: 'kuwo',    label: '酷我完整流' },
            { code: 'kugou',   label: '酷狗完整流' },
            { code: 'tencent', label: 'QQ完整流' },
            { code: 'netease', label: '网易完整流' }
        ];

        const MIN_VALID_DURATION = 65;

        const MARKETS = {
            cn: { title: "华语市场 TOP 热歌榜", desc: "Meting 聚合源 + B站联动 · 畅听全网无阻", playlistId: "3778678" },
            jp: { title: "日语市场 Oricon 公信榜", desc: "日本公信榜直连 + B站 ACG 翻唱/Live 联动", playlistId: "60131" },
            bb: { title: "Billboard & 欧美权威热榜", desc: "欧美热单全网穿透：自动调度 B站/酷我/酷狗完整音轨", playlistId: "60198" }
        };

        const FAV_STORAGE_KEY = "MUSIC_HUB_FAVORITES_V5";

        let currentTab = 'cn';
        let playlist = [];
        let searchResults = [];
        let favorites = [];
        let currentIndex = -1;
        let activePlayToken = 0;
        let activeWorkingChain = null; // 实时记录当前正在成功播放的采集链

        const audio = document.getElementById('audio');
        const songListEl = document.getElementById('songList');
        const npCover = document.getElementById('npCover');
        const npTitle = document.getElementById('npTitle');
        const npStatus = document.getElementById('npStatus');
        const playBtn = document.getElementById('playBtn');
        const npFavBtn = document.getElementById('npFavBtn');
        const progressBar = document.getElementById('progressBar');
        const curTimeEl = document.getElementById('curTime');
        const durTimeEl = document.getElementById('durTime');

        async function requestMeting(paramsStr, timeout = 5500) {
            for (let endpoint of METING_ENDPOINTS) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                try {
                    const res = await fetch(`${endpoint}?${paramsStr}`, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) return data;
                } catch (e) {
                    clearTimeout(timer);
                }
            }
            return [];
        }

        async function searchGDStudio(keyword) {
            const sources = ['kuwo', 'tencent', 'kugou'];
            const results = [];
            const tasks = sources.map(async (srv) => {
                try {
                    const res = await fetch(`https://music-api.gdstudio.xyz/api.php?types=search&source=${srv}&name=${encodeURIComponent(keyword)}&count=2`);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const first = data[0];
                        const urlRes = await fetch(`https://music-api.gdstudio.xyz/api.php?types=url&source=${srv}&id=${first.id}&br=320`);
                        const urlData = await urlRes.json();
                        if (urlData && urlData.url) {
                            results.push({ url: urlData.url, label: `GD-${srv.toUpperCase()}` });
                        }
                    }
                } catch (e) {}
            });
            await Promise.allSettled(tasks);
            return results;
        }

        function loadFavorites() {
            try {
                const raw = localStorage.getItem(FAV_STORAGE_KEY);
                favorites = raw ? JSON.parse(raw) : [];
            } catch (e) {
                favorites = [];
            }
            updateFavCountUI();
        }

        function saveFavorites() {
            localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favorites));
            updateFavCountUI();
        }

        function updateFavCountUI() {
            document.getElementById('favCount').innerText = favorites.length;
            if (currentIndex !== -1 && playlist[currentIndex]) {
                const liked = isSongFavorited(playlist[currentIndex]);
                npFavBtn.innerText = liked ? "❤️" : "🤍";
                npFavBtn.classList.toggle('liked', liked);
            }
        }

        function getSongFingerprint(title, artist) {
            const cleanTitle = (title || '').replace(/\(.*?\)|（.*?）|\[.*?\]/g, '').trim().toLowerCase();
            const cleanArtist = (artist || '').split(/[\/&,、]/)[0].trim().toLowerCase();
            return `${cleanTitle}__${cleanArtist}`;
        }

        function isSongFavorited(song) {
            const fp = getSongFingerprint(song.title, song.artist);
            return favorites.some(f => getSongFingerprint(f.title, f.artist) === fp);
        }

        // 核心修改：收藏时直接记录当时验证成功的具体采集链
        function toggleFavorite(song, event) {
            if (event) event.stopPropagation();
            const fp = getSongFingerprint(song.title, song.artist);
            const idx = favorites.findIndex(f => getSongFingerprint(f.title, f.artist) === fp);

            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                // 若当前正在播放此歌，且有成功的音源链，直接锁定保存
                let lockedSources = song.sources || [];
                if (currentIndex >= 0 && playlist[currentIndex] && getSongFingerprint(playlist[currentIndex].title, playlist[currentIndex].artist) === fp) {
                    if (activeWorkingChain) {
                        lockedSources = [activeWorkingChain];
                    } else if (audio.src) {
                        lockedSources = [{ url: audio.src, label: "当前直连链" }];
                    }
                }

                favorites.unshift({
                    title: song.title,
                    artist: song.artist,
                    cover: song.cover,
                    sources: lockedSources,
                    badgeText: lockedSources.length > 0 ? `⚡ 锁定源(${lockedSources[0].label})` : '已记录采集链',
                    verifiedFull: true
                });
            }
            saveFavorites();
            if (currentTab === 'fav') playlist = [...favorites];
            renderList();
        }

        function toggleCurrentFav() {
            if (currentIndex !== -1 && playlist[currentIndex]) {
                toggleFavorite(playlist[currentIndex]);
            }
        }

        function exportFavorites() {
            if (!favorites.length) return alert("收藏夹为空");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(favorites, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `MusicHub_Favorites_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importFavorites() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (Array.isArray(imported)) {
                            favorites = imported;
                            saveFavorites();
                            if (currentTab === 'fav') {
                                playlist = [...favorites];
                                renderList();
                            }
                            alert(`成功导入 ${favorites.length} 首收藏歌曲！`);
                        }
                    } catch (err) { alert("文件格式错误"); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        async function switchTab(tabKey) {
            currentTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${tabKey}`);
            if (activeBtn) activeBtn.classList.add('active');

            const isFav = (tabKey === 'fav');
            const isBB = (tabKey === 'bb');
            document.getElementById('exportFavBtn').style.display = isFav ? 'inline-block' : 'none';
            document.getElementById('importFavBtn').style.display = isFav ? 'inline-block' : 'none';
            document.getElementById('bbBoardSelect').style.display = isBB ? 'inline-block' : 'none';

            if (tabKey === 'fav') {
                document.getElementById('bannerTitle').innerText = "❤️ 我的私人收藏夹";
                document.getElementById('bannerDesc').innerText = "已记录专属工作采集链 · 点击收藏歌曲直连秒播，无需重新穿透";
                playlist = [...favorites];
                renderList();
            } else if (tabKey === 'search') {
                document.getElementById('bannerTitle').innerText = "🔍 聚合搜索结果";
                document.getElementById('bannerDesc').innerText = "多源并发检索结果 · 收藏时将自动锁定最优采集链";
                playlist = [...searchResults];
                renderList();
            } else {
                document.getElementById('bannerTitle').innerText = MARKETS[tabKey].title;
                document.getElementById('bannerDesc').innerText = MARKETS[tabKey].desc;
                const pid = isBB ? document.getElementById('bbBoardSelect').value : MARKETS[tabKey].playlistId;
                await loadMarketPlaylist(pid, isBB);
            }
        }

        async function changeBillboardChart() {
            const val = document.getElementById('bbBoardSelect').value;
            await loadMarketPlaylist(val, true);
        }

        async function loadMarketPlaylist(playlistId, isBillboard = false) {
            songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8;">正在加载榜单...</div>`;

            if (playlistId === '60131_apple') {
                try {
                    const res = await fetch('https://itunes.apple.com/us/rss/topsongs/limit=40/json');
                    const json = await res.json();
                    playlist = (json.feed.entry || []).map(item => ({
                        title: item['im:name'].label,
                        artist: item['im:artist'].label,
                        cover: item['im:image'][2].label,
                        sources: [],
                        badgeText: "Apple直连"
                    }));
                    npStatus.innerText = `已加载 Apple Music 榜 (${playlist.length}首)`;
                    renderList();
                    return;
                } catch (e) { playlistId = "60198"; }
            }

            const data = await requestMeting(`server=netease&type=playlist&id=${playlistId}`);
            if (data.length > 0) {
                playlist = data.slice(0, 45).map(item => ({
                    title: item.name || item.title || "未知曲目",
                    artist: item.artist || item.author || "未知歌手",
                    cover: item.pic || "https://picsum.photos/seed/music/100/100",
                    sources: [{ url: item.url, label: "榜单源" }],
                    badgeText: isBillboard ? "欧美穿透源" : "Meting聚合"
                }));
                npStatus.innerText = `榜单加载完毕 (${playlist.length}首)`;
                renderList();
            } else {
                songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:#f43f5e;">节点繁忙，请刷新</div>`;
            }
        }

        async function doAggregatedSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            document.getElementById('tab-search').style.display = 'inline-block';
            switchTab('search');

            songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--bili-pink);">正在向【B站音源 + 全网曲库】并发检索「${keyword}」...</div>`;

            const tasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(keyword)}`, 6000)
                    .then(list => ({ plat, list: list.slice(0, 15) }))
            );

            const settled = await Promise.allSettled(tasks);
            const mergedMap = new Map();

            settled.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    const { plat, list } = res.value;
                    list.forEach(item => {
                        const title = item.name || item.title || "未知歌曲";
                        const artist = item.artist || item.author || "未知歌手";
                        if (!item.url) return;

                        const fp = getSongFingerprint(title, artist);
                        if (!mergedMap.has(fp)) {
                            mergedMap.set(fp, {
                                title,
                                artist,
                                cover: item.pic || "https://picsum.photos/seed/music/100/100",
                                sources: [{ url: item.url, label: plat.label }],
                                labels: [plat.label]
                            });
                        } else {
                            const existing = mergedMap.get(fp);
                            if (!existing.labels.includes(plat.label)) {
                                existing.sources.push({ url: item.url, label: plat.label });
                                existing.labels.push(plat.label);
                            }
                            if (existing.cover.includes('picsum.photos') && item.pic) {
                                existing.cover = item.pic;
                            }
                        }
                    });
                }
            });

            searchResults = Array.from(mergedMap.values()).map(item => ({
                ...item,
                badgeText: `聚合 ${item.sources.length} 源`
            }));

            playlist = [...searchResults];
            renderList();
        }

        function renderList() {
            songListEl.innerHTML = '';
            if (playlist.length === 0) {
                songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8;">暂无搜索结果</div>`;
                return;
            }

            playlist.forEach((song, idx) => {
                const liked = isSongFavorited(song);
                const div = document.createElement('div');
                div.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
                div.onclick = () => playSong(idx);

                div.innerHTML = `
                    <div class="song-left">
                        <div class="rank">${idx + 1}</div>
                        <img src="${song.cover}" class="cover" loading="lazy" alt="">
                        <div class="meta">
                            <div class="title">${song.title}</div>
                            <div class="artist">${song.artist}</div>
                        </div>
                    </div>
                    <div class="song-right">
                        <span class="badge ${song.verifiedFull ? 'full-verified' : ''}">${song.badgeText || '聚合源'}</span>
                        <button class="fav-btn ${liked ? 'liked' : ''}" title="收藏">${liked ? '❤️' : '🤍'}</button>
                    </div>
                `;

                div.querySelector('.fav-btn').onclick = (e) => toggleFavorite(song, e);
                songListEl.appendChild(div);
            });
            updateFavCountUI();
        }

        // 核心修改：播放时优先尝试已缓存的采集链直连，若直连失效才走穿透
        async function playSong(idx) {
            if (!playlist[idx]) return;
            currentIndex = idx;
            const myToken = ++activePlayToken;
            const song = playlist[idx];
            activeWorkingChain = null; // 重置当前工作链

            renderList();
            npCover.src = song.cover;
            npTitle.innerText = `${song.title} - ${song.artist}`;

            // 优先策略：如果歌曲自带已保存的采集链（比如来自收藏夹或历史验证），直接尝试直连秒播！
            if (song.sources && song.sources.length > 0) {
                for (let srcObj of song.sources) {
                    if (myToken !== activePlayToken) return;
                    npStatus.innerText = `⚡ 直连缓存链 [${srcObj.label}]...`;
                    const check = await verifyAndPlayStream(srcObj.url, myToken);
                    if (check.ok) {
                        song.verifiedFull = true;
                        activeWorkingChain = srcObj; // 记录当前成功的工作链
                        song.badgeText = `⚡ 秒播 (${formatTime(check.duration)} · ${srcObj.label})`;
                        renderList();
                        npStatus.innerText = `⚡ 已直连秒播 (${formatTime(check.duration)}) · 来源: ${srcObj.label}`;
                        updateMediaSession(song);
                        return;
                    }
                }
            }

            if (myToken !== activePlayToken) return;

            // 若无缓存或缓存直连已失效（例如链接过期），则启动多源并发穿透寻找新链
            npStatus.innerText = `缓存链失效，正在全网穿透寻找完整版...`;
            const cleanTitle = song.title.replace(/\(.*?\)|（.*?）/g, '').trim();
            const cleanArtist = song.artist.split(/[\/&,、]/)[0].trim();
            const query = `${cleanTitle} ${cleanArtist}`.trim();

            const metingTasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(query)}`, 5000)
                    .then(list => ({ plat, list }))
            );
            const gdTask = searchGDStudio(query);

            const [settledMeting, gdSources] = await Promise.all([
                Promise.allSettled(metingTasks),
                gdTask
            ]);

            if (myToken !== activePlayToken) return;

            const candidatePool = [...gdSources];
            settledMeting.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    res.value.list.slice(0, 2).forEach(match => {
                        if (match && match.url) {
                            candidatePool.push({
                                url: match.url,
                                label: res.value.plat.label,
                                pic: match.pic
                            });
                        }
                    });
                }
            });

            for (let cand of candidatePool) {
                if (myToken !== activePlayToken) return;
                npStatus.innerText = `检验穿透流 [${cand.label}]...`;
                const check = await verifyAndPlayStream(cand.url, myToken);

                if (check.ok) {
                    song.sources = [cand]; // 更新并缓存该工作链
                    song.verifiedFull = true;
                    activeWorkingChain = cand; // 记录成功工作链
                    song.badgeText = `✓ (${formatTime(check.duration)} · ${cand.label})`;
                    if (cand.pic && song.cover.includes('picsum.photos')) {
                        song.cover = cand.pic;
                        npCover.src = cand.pic;
                    }
                    renderList();
                    npStatus.innerText = `✓ 穿透成功并已缓存链 (${formatTime(check.duration)}) · 来源: ${cand.label}`;
                    updateMediaSession(song);
                    return;
                }
            }

            if (myToken === activePlayToken) {
                song.badgeText = "⚠️ 未找到有效完整版";
                renderList();
                npStatus.innerText = `《${song.title}》暂未抓取到可用完整音频，已自动跳过。`;
                setTimeout(() => { if (myToken === activePlayToken) nextSong(); }, 1200);
            }
        }

        function verifyAndPlayStream(url, token) {
            return new Promise((resolve) => {
                if (!url) return resolve({ ok: false, reason: 'empty' });
                let settled = false;
                const finish = (result) => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve(result);
                };
                const timer = setTimeout(() => finish({ ok: false, reason: 'timeout' }), 5500);

                const onLoadedMetadata = () => {
                    if (token !== activePlayToken) return finish({ ok: false, reason: 'cancelled' });
                    const dur = audio.duration;
                    if (dur && isFinite(dur) && dur <= MIN_VALID_DURATION) {
                        audio.pause();
                        audio.removeAttribute('src');
                        return finish({ ok: false, reason: 'trial_30s', duration: dur });
                    }
                    audio.play().then(() => {
                        playBtn.innerText = "⏸";
                        finish({ ok: true, duration: dur || 200 });
                    }).catch(() => finish({ ok: false, reason: 'play_error' }));
                };

                const onError = () => finish({ ok: false, reason: 'network_error' });
                const cleanup = () => {
                    clearTimeout(timer);
                    audio.removeEventListener('loadedmetadata', onLoadedMetadata);
                    audio.removeEventListener('error', onError);
                };

                audio.pause();
                audio.addEventListener('loadedmetadata', onLoadedMetadata, { once: true });
                audio.addEventListener('error', onError, { once: true });
                audio.src = url;
                audio.load();
            });
        }

        function togglePlay() {
            if (currentIndex === -1 && playlist.length > 0) { playSong(0); return; }
            if (audio.paused) { audio.play(); playBtn.innerText = "⏸"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        }

        function prevSong() {
            if (!playlist.length) return;
            playSong((currentIndex - 1 + playlist.length) % playlist.length);
        }

        function nextSong() {
            if (!playlist.length) return;
            playSong((currentIndex + 1) % playlist.length);
        }

        function updateMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    artwork: [{ src: song.cover, sizes: '300x300', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('previoustrack', prevSong);
                navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && audio.duration > MIN_VALID_DURATION) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                curTimeEl.innerText = formatTime(audio.currentTime);
                durTimeEl.innerText = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        audio.addEventListener('ended', nextSong);

        loadFavorites();
        switchTab('cn');
    </script>
