<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneMusic</title>
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.88);
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --accent: #0284c7;
            --accent-light: #e0f2fe;
            --accent-glow: rgba(2, 132, 199, 0.2);
            --fav-red: #f43f5e;
            --green: #10b981;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            z-index: 20;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 4px 6px 4px 16px;
            flex: 1;
            max-width: 460px;
            min-width: 220px;
            transition: all 0.2s;
        }
        .search-bar:focus-within {
            background: #ffffff;
            box-shadow: 0 0 0 3px var(--accent-glow);
            border-color: var(--accent);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 8px;
            font-size: 0.86rem;
            outline: none;
        }

        .search-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .market-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .market-nav::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 1;
            min-width: 72px;
            text-align: center;
            background: #ffffff;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .tab-btn.fav-tab.active {
            background: var(--fav-red);
            color: #ffffff;
            border-color: var(--fav-red);
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 125px 20px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .banner-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #fff1f2 100%);
            border: 1px solid #bae6fd;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
        }

        .banner-info h2 {
            font-size: 1.12rem;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .banner-info p {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .banner-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }

        .sub-source-select {
            background: #ffffff;
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .play-all-btn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        /* 云同步按钮与上中下纯文字三栏菜单 */
        .cloud-wrap {
            position: relative;
            display: none;
        }

        .cloud-trigger-btn {
            background: #ffffff;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 13px;
            border-radius: 9px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .cloud-trigger-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: all 0.2s;
        }

        /* 云链接成功后点亮状态 */
        .cloud-trigger-btn.connected {
            color: var(--green);
            border-color: var(--green);
            background: #ecfdf5;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.28);
        }

        .cloud-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: var(--shadow-md);
            z-index: 50;
            width: 136px;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .cloud-dropdown.open {
            display: flex;
        }

        .cloud-row-btn {
            width: 100%;
            padding: 11px 14px;
            background: #ffffff;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s;
        }
        .cloud-row-btn:last-of-type {
            border-bottom: none;
        }
        .cloud-row-btn:hover:not(:disabled) {
            background: #f1f5f9;
        }
        .cloud-row-btn:disabled {
            color: #cbd5e1;
            cursor: not-allowed;
            background: #ffffff;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .song-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.15s;
        }

        .song-item:hover {
            background: var(--bg-card-hover);
        }

        .song-item.active {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .song-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .rank {
            width: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        .meta {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            flex: 1;
        }

        .title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            font-size: 0.76rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .badge {
            font-size: 0.68rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: #f0f9ff;
            color: var(--accent);
            border: 1px solid #bae6fd;
        }

        .badge.full-verified {
            color: var(--green);
            border-color: #a7f3d0;
            background: #ecfdf5;
        }

        .fav-btn {
            background: transparent;
            border: none;
            font-size: 1.15rem;
            cursor: pointer;
            line-height: 1;
            padding: 6px;
            border-radius: 50%;
            color: var(--text-secondary);
            transition: transform 0.15s;
        }
        .fav-btn:hover { transform: scale(1.18); }

        /* 底部播放栏 */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 8px 20px 12px 20px;
            z-index: 35;
            box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.05);
        }

        .player-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #cbd5e1;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent-glow);
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .np-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
            cursor: pointer;
        }

        .np-cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            background: #e2e8f0;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .np-meta {
            min-width: 0;
            flex: 1;
        }

        .np-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-lyric-mini {
            font-size: 0.75rem;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .np-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.86rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .ctrl-btn:hover {
            background: #e2e8f0;
        }

        .ctrl-btn.lyric-toggle {
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--accent);
            border-color: #bae6fd;
            background: #f0f9ff;
        }

        .ctrl-btn.play-pause {
            width: 42px;
            height: 42px;
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            font-weight: bold;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        /* 歌词全屏/抽屉视图 */
        .lyric-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 32;
            display: none;
            flex-direction: column;
            padding: 20px 24px 110px 24px;
            animation: fadeIn 0.2s ease;
        }
        .lyric-overlay.open {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lyric-header {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto 12px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lyric-close-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .lyric-body {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 36px;
            align-items: center;
            overflow: hidden;
        }

        .lyric-art-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
        }

        .lyric-big-cover {
            width: 240px;
            height: 240px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
            border: 1px solid var(--border-color);
        }

        .lyric-song-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .lyric-song-artist {
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .lyric-scroll-col {
            height: 100%;
            overflow-y: auto;
            padding: 120px 12px;
            scroll-behavior: smooth;
            text-align: center;
            scrollbar-width: none;
        }
        .lyric-scroll-col::-webkit-scrollbar { display: none; }

        .lyric-line {
            padding: 10px 8px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            transition: all 0.25s ease;
            cursor: pointer;
            border-radius: 8px;
            line-height: 1.6;
        }
        .lyric-line:hover {
            background: #f1f5f9;
        }
        .lyric-line.active {
            font-size: 1.18rem;
            font-weight: 700;
            color: var(--accent);
            transform: scale(1.03);
        }

        /* 云链接配置弹窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-mask.open {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-card h3 {
            font-size: 1.02rem;
            font-weight: 700;
        }

        .repo-grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 76px;
            gap: 8px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .form-group input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.84rem;
            outline: none;
            background: #ffffff;
        }
        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            header { padding: 10px 12px; }
            .search-bar { max-width: 100%; width: 100%; order: 3; }
            main { padding: 12px 12px 120px 12px; }
            .badge { display: none; }
            .lyric-body {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .lyric-art-col {
                flex-direction: row;
                text-align: left;
                background: #f8fafc;
                padding: 10px 12px;
                border-radius: 12px;
                border: 1px solid var(--border-color);
            }
            .lyric-big-cover {
                width: 52px;
                height: 52px;
                border-radius: 10px;
            }
            .lyric-scroll-col {
                padding: 70px 6px;
            }
            .repo-grid-row {
                grid-template-columns: 1fr 1fr 68px;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-title">OneMusic</div>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索歌名或歌手..." onkeydown="if(event.key==='Enter') doAggregatedSearch()">
                    <button class="search-btn" onclick="doAggregatedSearch()">搜索</button>
                </div>
            </div>

            <div class="market-nav">
                <button class="tab-btn active" id="tab-cn" onclick="switchTab('cn')">🇨🇳 华语榜</button>
                <button class="tab-btn" id="tab-jp" onclick="switchTab('jp')">🇯🇵 日语榜</button>
                <button class="tab-btn" id="tab-bb" onclick="switchTab('bb')">🇺🇸 欧美榜</button>
                <button class="tab-btn fav-tab" id="tab-fav" onclick="switchTab('fav')">❤️ 收藏 (<span id="favCount">0</span>)</button>
                <button class="tab-btn" id="tab-search" style="display:none;" onclick="switchTab('search')">🔍 结果</button>
            </div>
        </div>
    </header>

    <main>
        <div class="banner-card">
            <div class="banner-info">
                <h2 id="bannerTitle">华语榜 TOP 热歌</h2>
                <p id="bannerDesc">收藏时自动记录采集链，多端可通过公开仓 JSON 轻量云同步</p>
            </div>
            <div class="banner-actions">
                <select id="bbBoardSelect" class="sub-source-select" style="display:none;" onchange="changeBillboardChart()">
                    <option value="60198">Billboard 公告牌周榜</option>
                    <option value="2809513713">欧美热歌全量榜</option>
                    <option value="180106">UK 英国官方单曲榜</option>
                    <option value="60131_apple">Apple Music 全球榜</option>
                </select>

                <!-- 位置互换：全部连播在左，云同步在右 -->
                <button class="play-all-btn" onclick="playAllInView()">▶ 全部连播</button>

                <div class="cloud-wrap" id="cloudWrap">
                    <button class="cloud-trigger-btn" id="cloudTriggerBtn" onclick="toggleCloudMenu(event)" title="云同步">
                        <svg viewBox="0 0 24 24">
                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                        </svg>
                        <span id="cloudBtnText">云同步</span>
                    </button>

                    <!-- 上、中、下三栏纯文字设计 -->
                    <div class="cloud-dropdown" id="cloudDropdown" onclick="event.stopPropagation()">
                        <button class="cloud-row-btn" onclick="openCloudConfigModal()">云链接</button>
                        <button class="cloud-row-btn" onclick="cloudDownloadAndMerge()">云下行</button>
                        <button class="cloud-row-btn" id="cloudUploadBtn" onclick="cloudUploadJson()" disabled>云上传</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="song-list" id="songList"></div>
    </main>

    <!-- PC & 手机自适应歌词浮层 -->
    <div class="lyric-overlay" id="lyricOverlay">
        <div class="lyric-header">
            <span style="font-size:0.82rem;font-weight:600;color:var(--text-secondary);">🎵 实时同步歌词</span>

    <script>
        const METING_ENDPOINTS = [
            "https://api.injahow.cn/meting/",
            "https://api.qijieya.cn/meting/",
            "https://api.i-meto.com/meting/api"
        ];

        const UPSTREAM_PLATFORMS = [
            { code: 'bilibili', label: 'B站音源' },
            { code: 'kuwo',    label: '酷我完整流' },
            { code: 'kugou',   label: '酷狗完整流' },
            { code: 'tencent', label: 'QQ完整流' },
            { code: 'netease', label: '网易完整流' }
        ];

        const MIN_VALID_DURATION = 65;

        const MARKETS = {
            cn: { title: "华语榜 TOP 热歌", desc: "聚合源 + B站联动 · 畅听全网完整曲库", playlistId: "3778678" },
            jp: { title: "日语榜 Oricon 精选", desc: "日本公信榜直连 + ACG 翻唱/Live 联动", playlistId: "60131" },
            bb: { title: "欧美榜 权威热单", desc: "欧美流行全网穿透 · 自动调度完整音轨", playlistId: "60198" }
        };

        const FAV_STORAGE_KEY = "ONEMUSIC_FAVORITES_V1";
        const CLOUD_CFG_KEY = "ONEMUSIC_CLOUD_CLEAN_V3";
        const CLOUD_JSON_FILE = "favorites.json";

        // 清理之前残留的旧版测试配置，确保初次打开完全空白
        localStorage.removeItem("ONEMUSIC_CLOUD_CONFIG_V1");
        localStorage.removeItem("ONEMUSIC_CLOUD_CONFIG_V2");

        let currentTab = 'cn';
        let viewList = [];
        let playingQueue = [];
        let playingIndex = -1;
        let currentPlayingSong = null;

        let searchResults = [];
        let favorites = [];
        let activePlayToken = 0;
        let activeWorkingChain = null;

        let isCloudConnected = false;
        let hasCloudDownloadedAndMerged = false;

        let currentLyrics = [];
        let activeLyricIndex = -1;

        const audio = document.getElementById('audio');
        const songListEl = document.getElementById('songList');
        const npCover = document.getElementById('npCover');
        const npTitle = document.getElementById('npTitle');
        const npStatus = document.getElementById('npStatus');
        const playBtn = document.getElementById('playBtn');
        const npFavBtn = document.getElementById('npFavBtn');
        const progressBar = document.getElementById('progressBar');
        const curTimeEl = document.getElementById('curTime');
        const durTimeEl = document.getElementById('durTime');

        async function requestMeting(paramsStr, timeout = 5500) {
            for (let endpoint of METING_ENDPOINTS) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                try {
                    const res = await fetch(`${endpoint}?${paramsStr}`, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) return data;
                } catch (e) {
                    clearTimeout(timer);
                }
            }
            return [];
        }

        async function searchGDStudio(keyword) {
            const sources = ['kuwo', 'tencent', 'kugou'];
            const results = [];
            const tasks = sources.map(async (srv) => {
                try {
                    const res = await fetch(`https://music-api.gdstudio.xyz/api.php?types=search&source=${srv}&name=${encodeURIComponent(keyword)}&count=2`);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const first = data[0];
                        const urlRes = await fetch(`https://music-api.gdstudio.xyz/api.php?types=url&source=${srv}&id=${first.id}&br=320`);
                        const urlData = await urlRes.json();
                        if (urlData && urlData.url) {
                            results.push({
                                url: urlData.url,
                                label: `GD-${srv.toUpperCase()}`,
                                lyricId: first.lyric_id || first.id,
                                srv: srv
                            });
                        }
                    }
                } catch (e) {}
            });
            await Promise.allSettled(tasks);
            return results;
        }

        /* ================= 收藏与云同步模块 ================= */
        function loadFavorites() {
            try {
                const raw = localStorage.getItem(FAV_STORAGE_KEY) || localStorage.getItem("MUSIC_HUB_FAVORITES_V5");
                favorites = raw ? JSON.parse(raw) : [];
            } catch (e) {
                favorites = [];
            }
            updateFavCountUI();
        }

        function saveFavorites() {
            localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favorites));
            updateFavCountUI();
        }

        function updateFavCountUI() {
            document.getElementById('favCount').innerText = favorites.length;
            if (currentPlayingSong) {
                const liked = isSongFavorited(currentPlayingSong);
                npFavBtn.innerText = liked ? "❤️" : "🤍";
            } else {
                npFavBtn.innerText = "🤍";
            }
        }

        function getSongFingerprint(title, artist) {
            const cleanTitle = (title || '').replace(/\(.*?\)|（.*?）|\[.*?\]/g, '').trim().toLowerCase();
            const cleanArtist = (artist || '').split(/[\/&,、]/)[0].trim().toLowerCase();
            return `${cleanTitle}__${cleanArtist}`;
        }

        function isSongFavorited(song) {
            if (!song) return false;
            const fp = getSongFingerprint(song.title, song.artist);
            return favorites.some(f => getSongFingerprint(f.title, f.artist) === fp);
        }

        function isSameSong(songA, songB) {
            if (!songA || !songB) return false;
            return getSongFingerprint(songA.title, songA.artist) === getSongFingerprint(songB.title, songB.artist);
        }

        function toggleFavorite(song, event) {
            if (event) event.stopPropagation();
            if (!song) return;

            const fp = getSongFingerprint(song.title, song.artist);
            const idx = favorites.findIndex(f => getSongFingerprint(f.title, f.artist) === fp);

            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                let lockedSources = song.sources || [];
                if (currentPlayingSong && isSameSong(currentPlayingSong, song)) {
                    if (activeWorkingChain) {
                        lockedSources = [activeWorkingChain];
                    } else if (audio.src) {
                        lockedSources = [{ url: audio.src, label: "直连链" }];
                    }
                }
                favorites.unshift({
                    title: song.title,
                    artist: song.artist,
                    cover: song.cover,
                    sources: lockedSources.map(s => ({ url: s.url, label: s.label })),
                    badgeText: lockedSources.length > 0 ? `⚡ 锁定(${lockedSources[0].label})` : '已记录采集链',
                    verifiedFull: true
                });
            }
            saveFavorites();
            if (currentTab === 'fav') {
                viewList = [...favorites];
            }
            renderList();
        }

        function toggleCurrentFav() {
            if (currentPlayingSong) {
                toggleFavorite(currentPlayingSong);
            }
        }

        function toggleCloudMenu(e) {
            e.stopPropagation();
            document.getElementById('cloudDropdown').classList.toggle('open');
        }

        document.addEventListener('click', () => {
            const dd = document.getElementById('cloudDropdown');
            if (dd) dd.classList.remove('open');
        });

        function getCloudConfig() {
            try {
                const cfg = JSON.parse(localStorage.getItem(CLOUD_CFG_KEY));
                if (cfg && typeof cfg === 'object') return cfg;
            } catch (e) {}
            return { owner: '', repoName: '', branch: '', token: '' };
        }

        function setCloudLightStatus(connected) {
            isCloudConnected = connected;
            const btn = document.getElementById('cloudTriggerBtn');
            const txt = document.getElementById('cloudBtnText');
            if (connected) {
                btn.classList.add('connected');
                txt.innerText = '已连接';
            } else {
                btn.classList.remove('connected');
                txt.innerText = '云同步';
            }
        }

        function openCloudConfigModal() {
            document.getElementById('cloudDropdown').classList.remove('open');
            const cfg = getCloudConfig();
            document.getElementById('cfgOwner').value = cfg.owner || '';
            document.getElementById('cfgRepoName').value = cfg.repoName || '';
            document.getElementById('cfgBranch').value = cfg.branch || '';
            document.getElementById('cfgToken').value = cfg.token || '';
            document.getElementById('cloudModal').classList.add('open');
        }

        function closeCloudConfigModal() {
            document.getElementById('cloudModal').classList.remove('open');
        }

        async function saveCloudConfig() {
            const owner = document.getElementById('cfgOwner').value.trim();
            const repoName = document.getElementById('cfgRepoName').value.trim();
            const branch = document.getElementById('cfgBranch').value.trim() || 'main';
            const token = document.getElementById('cfgToken').value.trim();

            if (!owner || !repoName) {
                alert('请手工填写用户名和仓库名');
                return;
            }

            localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({ owner, repoName, branch, token }));
            closeCloudConfigModal();

            // 验证连接并自动拉取同步一次
            await cloudDownloadAndMerge();
        }

        async function cloudDownloadAndMerge() {
            document.getElementById('cloudDropdown').classList.remove('open');
            const cfg = getCloudConfig();
            if (!cfg.owner || !cfg.repoName) {
                openCloudConfigModal();
                return;
            }

            const branch = cfg.branch || 'main';
            npStatus.innerText = "正在连接公开仓并拉取 favorites.json...";

            try {
                const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repoName}/contents/${CLOUD_JSON_FILE}?ref=${encodeURIComponent(branch)}`;
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (cfg.token) headers['Authorization'] = `token ${cfg.token}`;

                const res = await fetch(apiUrl, { headers, cache: 'no-store' });
                let remoteList = [];

                if (res.status === 200) {
                    const data = await res.json();
                    const jsonStr = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
                    const parsed = JSON.parse(jsonStr);
                    if (Array.isArray(parsed)) remoteList = parsed;
                } else if (res.status === 404) {
                    // 验证仓库本身是否存在
                    const repoRes = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repoName}`, { headers, cache: 'no-store' });
                    if (!repoRes.ok) throw new Error(`找不到公开仓库 ${cfg.owner}/${cfg.repoName}`);
                    remoteList = [];
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }

                const mergedMap = new Map();
                [...favorites, ...remoteList].forEach(item => {
                    if (!item || !item.title) return;
                    const fp = getSongFingerprint(item.title, item.artist);
                    if (!mergedMap.has(fp)) {
                        mergedMap.set(fp, {
                            title: item.title,
                            artist: item.artist || '',
                            cover: item.cover || 'https://picsum.photos/seed/music/100/100',
                            sources: Array.isArray(item.sources) ? item.sources : [],
                            badgeText: item.badgeText || '⚡ 云同步源',
                            verifiedFull: true
                        });
                    } else {
                        const cur = mergedMap.get(fp);
                        if ((!cur.sources || !cur.sources.length) && item.sources && item.sources.length) {
                            cur.sources = item.sources;
                        }
                    }
                });

                favorites = Array.from(mergedMap.values());
                saveFavorites();
                if (currentTab === 'fav') {
                    viewList = [...favorites];
                    renderList();
                }

                // 点亮云同步图标，解锁云上传
                setCloudLightStatus(true);
                hasCloudDownloadedAndMerged = true;
                document.getElementById('cloudUploadBtn').disabled = false;
                npStatus.innerText = `✅ 云链接与下行整合成功 (共 ${favorites.length} 首)，已解锁云上传`;
            } catch (err) {
                setCloudLightStatus(false);
                npStatus.innerText = `⚠️ 云连接失败: ${err.message}`;
                alert(`云连接或下行失败：${err.message}`);
            }
        }

        // 修复：云上传不再强制拦截弹登录框
        async function cloudUploadJson() {
            document.getElementById('cloudDropdown').classList.remove('open');

            if (!hasCloudDownloadedAndMerged) {
                alert("请先点击「云下行」整合本地数据后，再执行云上传。");
                return;
            }

            const cfg = getCloudConfig();
            if (!cfg.owner || !cfg.repoName) {
                openCloudConfigModal();
                return;
            }

            const branch = cfg.branch || 'main';
            npStatus.innerText = "⬆️ 正在上传 favorites.json 至公开仓...";

            try {
                const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repoName}/contents/${CLOUD_JSON_FILE}`;
                const headers = {
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };
                if (cfg.token) {
                    headers['Authorization'] = `token ${cfg.token}`;
                }

                let sha = undefined;
                const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers, cache: 'no-store' });
                if (getRes.status === 200) {
                    const getJson = await getRes.json();
                    sha = getJson.sha;
                }

                const cleanPayload = favorites.map(f => ({
                    title: f.title,
                    artist: f.artist,
                    cover: f.cover,
                    sources: (f.sources || []).map(s => ({ url: s.url, label: s.label })),
                    badgeText: f.badgeText
                }));

                const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(cleanPayload, null, 2))));
                const body = {
                    message: `Sync OneMusic favorites (${cleanPayload.length} songs)`,
                    content: contentBase64,
                    branch: branch
                };
                if (sha) body.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(body)
                });

                if (!putRes.ok) {
                    const errData = await putRes.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${putRes.status}`);
                }

                setCloudLightStatus(true);
                npStatus.innerText = `🎉 云上传成功！已同步 ${cleanPayload.length} 首歌曲配置`;
                alert(`云上传成功！已同步 ${cleanPayload.length} 首收藏配置至 ${cfg.owner}/${cfg.repoName}`);
            } catch (err) {
                npStatus.innerText = `❌ 云上传失败: ${err.message}`;
                alert(`云上传失败：${err.message}\n（提示：GitHub 公开仓库写入文件要求在「云链接」中填入有效 Token）`);
            }
        }

        /* ================= 歌词解析与同步模块 ================= */
        function toggleLyricOverlay() {
            document.getElementById('lyricOverlay').classList.toggle('open');
        }

        function parseLrc(lrcText) {
            if (!lrcText || typeof lrcText !== 'string') return [];
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;

            for (let line of lines) {
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;
                let match;
                timeReg.lastIndex = 0;
                while ((match = timeReg.exec(line)) !== null) {
                    const min = parseInt(match[1], 10);
                    const sec = parseInt(match[2], 10);
                    const ms = parseInt(match[3], 10) / (match[3].length === 3 ? 1000 : 100);
                    result.push({ time: min * 60 + sec + ms, text });
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }

        async function fetchLyricsForSong(song, token) {
            currentLyrics = [];
            activeLyricIndex = -1;
            renderLyricsDOM([{ time: 0, text: `正在加载《${song.title}》歌词...` }]);

            const cleanTitle = song.title.replace(/\(.*?\)|（.*?）/g, '').trim();
            const cleanArtist = song.artist.split(/[\/&,、]/)[0].trim();
            const query = `${cleanTitle} ${cleanArtist}`.trim();

            try {
                const list = await requestMeting(`server=netease&type=search&id=${encodeURIComponent(query)}`, 4500);
                if (token !== activePlayToken) return;

                if (Array.isArray(list) && list.length > 0 && list[0].lrc) {
                    const res = await fetch(list[0].lrc);
                    const lrcStr = await res.text();
                    const parsed = parseLrc(lrcStr);
                    if (parsed.length > 0) {
                        currentLyrics = parsed;
                        renderLyricsDOM(currentLyrics);
                        return;
                    }
                }

                const lrcLibRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                if (lrcLibRes.ok) {
                    const lrcArr = await lrcLibRes.json();
                    if (Array.isArray(lrcArr) && lrcArr.length > 0 && lrcArr[0].syncedLyrics) {
                        const parsed = parseLrc(lrcArr[0].syncedLyrics);
                        if (parsed.length > 0) {
                            currentLyrics = parsed;
                            renderLyricsDOM(currentLyrics);
                            return;
                        }
                    }
                }
            } catch (e) {}

            if (token === activePlayToken && currentLyrics.length === 0) {
                renderLyricsDOM([
                    { time: 0, text: `${song.title} - ${song.artist}` },
                    { time: 2, text: "纯音乐或暂未匹配到时间轴歌词，请尽情聆听 🎵" }
                ]);
            }
        }

        function renderLyricsDOM(lines) {
            const box = document.getElementById('lyricScrollBox');
            box.innerHTML = '';
            lines.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `lyric-line ${idx === 0 ? 'active' : ''}`;
                div.innerText = item.text;
                div.onclick = () => {
                    if (audio.duration && item.time >= 0) {
                        audio.currentTime = item.time;
                    }
                };
                box.appendChild(div);
            });
        }

        function syncLyricProgress(currentTime) {
            if (!currentLyrics.length) return;
            let idx = 0;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) {
                    idx = i;
                } else {
                    break;
                }
            }
            if (idx !== activeLyricIndex) {
                activeLyricIndex = idx;
                const box = document.getElementById('lyricScrollBox');
                const nodes = box.querySelectorAll('.lyric-line');
                nodes.forEach((n, i) => n.classList.toggle('active', i === idx));
                if (nodes[idx]) {
                    nodes[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                if (currentLyrics[idx]) {
                    npStatus.innerText = `♪ ${currentLyrics[idx].text}`;
                }
            }
        }

        /* ================= 榜单与播放核心 ================= */
        async function switchTab(tabKey) {
            currentTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${tabKey}`);
            if (activeBtn) activeBtn.classList.add('active');

            const isFav = (tabKey === 'fav');
            const isBB = (tabKey === 'bb');
            document.getElementById('cloudWrap').style.display = isFav ? 'inline-block' : 'none';
            document.getElementById('bbBoardSelect').style.display = isBB ? 'inline-block' : 'none';

            if (tabKey === 'fav') {
                document.getElementById('bannerTitle').innerText = "❤️ 我的收藏";
                document.getElementById('bannerDesc').innerText = "已记录专属采集链 · 支持右侧云标志进行公开仓同步";
                viewList = [...favorites];
                renderList();
            } else if (tabKey === 'search') {
                document.getElementById('bannerTitle').innerText = "🔍 聚合搜索结果";
                document.getElementById('bannerDesc').innerText = "多源并发检索结果 · 收藏时自动锁定当前可用采集链";
                viewList = [...searchResults];
                renderList();
            } else {
                document.getElementById('bannerTitle').innerText = MARKETS[tabKey].title;
                document.getElementById('bannerDesc').innerText = MARKETS[tabKey].desc;
                const pid = isBB ? document.getElementById('bbBoardSelect').value : MARKETS[tabKey].playlistId;
                await loadMarketPlaylist(pid, isBB);
            }
        }

        async function changeBillboardChart() {
            const val = document.getElementById('bbBoardSelect').value;
            await loadMarketPlaylist(val, true);
        }

        async function loadMarketPlaylist(playlistId, isBillboard = false) {
            songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-secondary);">正在加载榜单...</div>`;

            if (playlistId === '60131_apple') {
                try {
                    const res = await fetch('https://itunes.apple.com/us/rss/topsongs/limit=40/json');
                    const json = await res.json();
                    viewList = (json.feed.entry || []).map(item => ({
                        title: item['im:name'].label,
                        artist: item['im:artist'].label,
                        cover: item['im:image'][2].label,
                        sources: [],
                        badgeText: "Apple直连"
                    }));
                    renderList();
                    return;
                } catch (e) { playlistId = "60198"; }
            }

            const data = await requestMeting(`server=netease&type=playlist&id=${playlistId}`);
            if (data.length > 0) {
                viewList = data.slice(0, 45).map(item => ({
                    title: item.name || item.title || "未知曲目",
                    artist: item.artist || item.author || "未知歌手",
                    cover: item.pic || "https://picsum.photos/seed/music/100/100",
                    sources: [{ url: item.url, label: "榜单源" }],
                    badgeText: isBillboard ? "欧美穿透源" : "Meting聚合"
                }));
                renderList();
            } else {
                songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--fav-red);">节点繁忙，请稍后刷新</div>`;
            }
        }

        async function doAggregatedSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            document.getElementById('tab-search').style.display = 'inline-block';
            switchTab('search');

            songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--accent);">正在并发检索「${keyword}」...</div>`;

            const tasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(keyword)}`, 6000)
                    .then(list => ({ plat, list: list.slice(0, 15) }))
            );

            const settled = await Promise.allSettled(tasks);
            const mergedMap = new Map();

            settled.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    const { plat, list } = res.value;
                    list.forEach(item => {
                        const title = item.name || item.title || "未知歌曲";
                        const artist = item.artist || item.author || "未知歌手";
                        if (!item.url) return;

                        const fp = getSongFingerprint(title, artist);
                        if (!mergedMap.has(fp)) {
                            mergedMap.set(fp, {
                                title,
                                artist,
                                cover: item.pic || "https://picsum.photos/seed/music/100/100",
                                sources: [{ url: item.url, label: plat.label }],
                                labels: [plat.label]
                            });
                        } else {
                            const existing = mergedMap.get(fp);
                            if (!existing.labels.includes(plat.label)) {
                                existing.sources.push({ url: item.url, label: plat.label });
                                existing.labels.push(plat.label);
                            }
                            if (existing.cover.includes('picsum.photos') && item.pic) {
                                existing.cover = item.pic;
                            }
                        }
                    });
                }
            });

            searchResults = Array.from(mergedMap.values()).map(item => ({
                ...item,
                badgeText: `聚合 ${item.sources.length} 源`
            }));

            viewList = [...searchResults];
            renderList();
        }

        function renderList() {
            songListEl.innerHTML = '';
            if (viewList.length === 0) {
                songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-secondary);">列表暂无歌曲</div>`;
                updateFavCountUI();
                return;
            }

            viewList.forEach((song, idx) => {
                const liked = isSongFavorited(song);
                const isCurrentlyPlayingThis = isSameSong(song, currentPlayingSong);

                const div = document.createElement('div');
                div.className = `song-item ${isCurrentlyPlayingThis ? 'active' : ''}`;
                div.onclick = () => startPlayFromView(idx);

                div.innerHTML = `
                    <div class="song-left">
                        <div class="rank">${idx + 1}</div>
                        <img src="${song.cover}" class="cover" loading="lazy" alt="">
                        <div class="meta">
                            <div class="title">${song.title}</div>
                            <div class="artist">${song.artist}</div>
                        </div>
                    </div>
                    <div class="song-right">
                        <span class="badge ${song.verifiedFull ? 'full-verified' : ''}">${song.badgeText || '聚合源'}</span>
                        <button class="fav-btn" title="收藏">${liked ? '❤️' : '🤍'}</button>
                    </div>
                `;

                div.querySelector('.fav-btn').onclick = (e) => toggleFavorite(song, e);
                songListEl.appendChild(div);
            });
            updateFavCountUI();
        }

        function playAllInView() {
            if (viewList.length > 0) {
                startPlayFromView(0);
            }
        }

        function startPlayFromView(idx) {
            if (!viewList[idx]) return;
            playingQueue = [...viewList];
            playSongInQueue(idx);
        }

        async function playSongInQueue(idx) {
            if (!playingQueue[idx]) return;
            playingIndex = idx;
            const myToken = ++activePlayToken;
            const song = playingQueue[idx];
            currentPlayingSong = song;
            activeWorkingChain = null;

            renderList();
            npCover.src = song.cover;
            npTitle.innerText = `${song.title} - ${song.artist}`;
            document.getElementById('lyricCover').src = song.cover;
            document.getElementById('lyricTitle').innerText = song.title;
            document.getElementById('lyricArtist').innerText = song.artist;

            fetchLyricsForSong(song, myToken);

            const favMatch = favorites.find(f => isSameSong(f, song));
            const combinedSources = [
                ...(favMatch && favMatch.sources ? favMatch.sources : []),
                ...(song.sources || [])
            ];

            if (combinedSources.length > 0) {
                for (let srcObj of combinedSources) {
                    if (myToken !== activePlayToken) return;
                    npStatus.innerText = `⚡ 直连采集链 [${srcObj.label}]...`;
                    const check = await verifyAndPlayStream(srcObj.url, myToken);
                    if (check.ok) {
                        song.verifiedFull = true;
                        activeWorkingChain = srcObj;
                        song.badgeText = `⚡ 秒播 (${formatTime(check.duration)} · ${srcObj.label})`;
                        renderList();
                        npStatus.innerText = `⚡ 直连秒播 (${formatTime(check.duration)}) · ${srcObj.label}`;
                        updateMediaSession(song);
                        return;
                    }
                }
            }

            if (myToken !== activePlayToken) return;

            npStatus.innerText = `正在全网穿透寻找完整音源...`;
            const cleanTitle = song.title.replace(/\(.*?\)|（.*?）/g, '').trim();
            const cleanArtist = song.artist.split(/[\/&,、]/)[0].trim();
            const query = `${cleanTitle} ${cleanArtist}`.trim();

            const metingTasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(query)}`, 5000)
                    .then(list => ({ plat, list }))
            );
            const gdTask = searchGDStudio(query);

            const [settledMeting, gdSources] = await Promise.all([
                Promise.allSettled(metingTasks),
                gdTask
            ]);

            if (myToken !== activePlayToken) return;

            const candidatePool = [...gdSources];
            settledMeting.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    res.value.list.slice(0, 2).forEach(match => {
                        if (match && match.url) {
                            candidatePool.push({
                                url: match.url,
                                label: res.value.plat.label,
                                pic: match.pic
                            });
                        }
                    });
                }
            });

            for (let cand of candidatePool) {
                if (myToken !== activePlayToken) return;
                npStatus.innerText = `检验音源 [${cand.label}]...`;
                const check = await verifyAndPlayStream(cand.url, myToken);

                if (check.ok) {
                    song.sources = [{ url: cand.url, label: cand.label }];
                    song.verifiedFull = true;
                    activeWorkingChain = cand;
                    song.badgeText = `✓ (${formatTime(check.duration)} · ${cand.label})`;
                    if (cand.pic && song.cover.includes('picsum.photos')) {
                        song.cover = cand.pic;
                        npCover.src = cand.pic;
                        document.getElementById('lyricCover').src = cand.pic;
                    }
                    renderList();
                    npStatus.innerText = `✓ 正在播放 (${formatTime(check.duration)}) · ${cand.label}`;
                    updateMediaSession(song);
                    return;
                }
            }

            if (myToken === activePlayToken) {
                song.badgeText = "⚠️ 暂无完整源";
                renderList();
                npStatus.innerText = `《${song.title}》未找到有效音频，自动切歌...`;
                setTimeout(() => { if (myToken === activePlayToken) nextSong(); }, 1200);
            }
        }

        function verifyAndPlayStream(url, token) {
            return new Promise((resolve) => {
                if (!url) return resolve({ ok: false, reason: 'empty' });
                let settled = false;
                const finish = (result) => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve(result);
                };
                const timer = setTimeout(() => finish({ ok: false, reason: 'timeout' }), 5500);

                const onLoadedMetadata = () => {
                    if (token !== activePlayToken) return finish({ ok: false, reason: 'cancelled' });
                    const dur = audio.duration;
                    if (dur && isFinite(dur) && dur <= MIN_VALID_DURATION) {
                        audio.pause();
                        audio.removeAttribute('src');
                        return finish({ ok: false, reason: 'trial_30s', duration: dur });
                    }
                    audio.play().then(() => {
                        playBtn.innerText = "⏸";
                        finish({ ok: true, duration: dur || 200 });
                    }).catch(() => finish({ ok: false, reason: 'play_error' }));
                };

                const onError = () => finish({ ok: false, reason: 'network_error' });
                const cleanup = () => {
                    clearTimeout(timer);
                    audio.removeEventListener('loadedmetadata', onLoadedMetadata);
                    audio.removeEventListener('error', onError);
                };

                audio.pause();
                audio.addEventListener('loadedmetadata', onLoadedMetadata, { once: true });
                audio.addEventListener('error', onError, { once: true });
                audio.src = url;
                audio.load();
            });
        }

        function togglePlay() {
            if (!currentPlayingSong && viewList.length > 0) {
                startPlayFromView(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸";
            } else {
                audio.pause();
                playBtn.innerText = "▶";
            }
        }

        function prevSong() {
            if (!playingQueue.length) return;
            playSongInQueue((playingIndex - 1 + playingQueue.length) % playingQueue.length);
        }

        function nextSong() {
            if (!playingQueue.length) return;
            playSongInQueue((playingIndex + 1) % playingQueue.length);
        }

        function updateMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    artwork: [{ src: song.cover, sizes: '300x300', type: 'image/jpeg' }]
                });
                navigator.mediaSession.setActionHandler('previoustrack', prevSong);
                navigator.mediaSession.setActionHandler('nexttrack', nextSong);
            }
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && audio.duration > MIN_VALID_DURATION) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                curTimeEl.innerText = formatTime(audio.currentTime);
                durTimeEl.innerText = formatTime(audio.duration);
                syncLyricProgress(audio.currentTime);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        audio.addEventListener('ended', nextSong);

        loadFavorites();
        switchTab('cn');
    </script>
</body>
