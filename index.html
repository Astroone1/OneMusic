        function playAllInView() {
            if (viewList.length === 0) return;
            playingQueue = [...viewList];
            if (isShuffleMode) {
                const randIdx = Math.floor(Math.random() * playingQueue.length);
                playSongInQueue(randIdx);
            } else {
                playSongInQueue(0);
            }
        }

        function startPlayFromView(idx) {
            if (!viewList[idx]) return;
            playingQueue = [...viewList];
            playSongInQueue(idx);
        }

        async function playSongInQueue(idx) {
            if (!playingQueue[idx]) return;
            playingIndex = idx;
            const myToken = ++activePlayToken;
            const song = playingQueue[idx];
            currentPlayingSong = song;
            activeWorkingChain = null;

            renderList();
            npCover.src = song.cover;
            npTitle.innerText = `${song.title} - ${song.artist}`;
            document.getElementById('lyricCover').src = song.cover;
            document.getElementById('lyricTitle').innerText = song.title;
            document.getElementById('lyricArtist').innerText = song.artist;

            updateMediaSession(song);
            fetchLyricsForSong(song, myToken);

            const favMatch = favorites.find(f => isSameSong(f, song));
            const combinedSources = [
                ...(favMatch && favMatch.sources ? favMatch.sources : []),
                ...(song.sources || [])
            ];

            if (combinedSources.length > 0) {
                for (let srcObj of combinedSources) {
                    if (myToken !== activePlayToken) return;
                    npStatus.innerText = `⚡ 直连 [${srcObj.label}]...`;
                    const check = await verifyAndPlayStream(srcObj.url, myToken);
                    if (check.ok) {
                        song.verifiedFull = true;
                        activeWorkingChain = srcObj;
                        song.badgeText = `⚡ 320k直通 (${formatTime(check.duration)} · ${srcObj.label})`;
                        syncFavoriteLatestChain(song, srcObj, check.duration);
                        renderList();
                        npStatus.innerText = `⚡ ${formatTime(check.duration)} · ${srcObj.label}`;
                        updateMediaSession(song);
                        return;
                    }
                }
            }

            if (myToken !== activePlayToken) return;

            npStatus.innerText = `正在穿透采集 320k 音源...`;
            const cleanTitle = song.title.replace(/\(.*?\)|（.*?）/g, '').trim();
            const cleanArtist = song.artist.split(/[\/&,、]/)[0].trim();
            const query = `${cleanTitle} ${cleanArtist}`.trim();

            const metingTasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(query)}`, 5000)
                    .then(list => ({ plat, list }))
            );
            const gdTask = searchGDStudio(query);

            const [settledMeting, gdSources] = await Promise.all([
                Promise.allSettled(metingTasks),
                gdTask
            ]);

            if (myToken !== activePlayToken) return;

            const primaryNonBili = [];
            const biliCandidates = [];
            const otherCandidates = [];

            if (gdSources.length > 0) {
                primaryNonBili.push(gdSources[0]);
            }

            settledMeting.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    const isBili = res.value.plat.code === 'bilibili';
                    res.value.list.slice(0, 2).forEach(match => {
                        if (match && match.url) {
                            const item = {
                                url: match.url,
                                label: res.value.plat.label,
                                pic: match.pic
                            };
                            if (isBili) {
                                biliCandidates.push(item);
                            } else if (primaryNonBili.length === 0) {
                                primaryNonBili.push(item);
                            } else {
                                otherCandidates.push(item);
                            }
                        }
                    });
                }
            });

            const candidatePool = [
                ...biliCandidates,
                ...primaryNonBili,
                ...gdSources.slice(1),
                ...otherCandidates
            ];

            for (let cand of candidatePool) {
                if (myToken !== activePlayToken) return;
                npStatus.innerText = `校验 [${cand.label}]...`;
                const check = await verifyAndPlayStream(cand.url, myToken);

                if (check.ok) {
                    const latestChain = { url: cand.url, label: cand.label };
                    song.sources = [latestChain];
                    song.verifiedFull = true;
                    activeWorkingChain = latestChain;
                    song.badgeText = `✓ 320k直通 (${formatTime(check.duration)} · ${cand.label})`;
                    if (cand.pic && song.cover.includes('picsum.photos')) {
                        song.cover = cand.pic;
                        npCover.src = cand.pic;
                        document.getElementById('lyricCover').src = cand.pic;
                    }
                    syncFavoriteLatestChain(song, latestChain, check.duration);
                    renderList();
                    npStatus.innerText = `✓ ${formatTime(check.duration)} · ${cand.label}`;
                    updateMediaSession(song);
                    return;
                }
            }

            if (myToken === activePlayToken) {
                song.badgeText = "⚠️ 暂无音源";
                renderList();
                npStatus.innerText = `未找到可用完整版音频，自动切歌...`;
                setTimeout(() => { if (myToken === activePlayToken) nextSong(); }, 1200);
            }
        }

        function verifyAndPlayStream(url, token) {
            return new Promise((resolve) => {
                if (!url) return resolve({ ok: false, reason: 'empty' });
                let settled = false;
                const finish = (res) => {
                    if (settled) return;
                    settled = true;
                    cleanup();
                    resolve(res);
                };

                const timer = setTimeout(() => finish({ ok: false, reason: 'timeout' }), 5000);

                const onLoadedMetadata = () => {
                    if (token !== activePlayToken) return finish({ ok: false, reason: 'cancelled' });
                    const dur = audio.duration;
                    if (dur && isFinite(dur) && dur <= MIN_VALID_DURATION) {
                        audio.pause();
                        audio.removeAttribute('src');
                        return finish({ ok: false, reason: 'trial_30s', duration: dur });
                    }
                    audio.play().then(() => {
                        setPlayButtonVisual(true);
                        finish({ ok: true, duration: dur || 200 });
                    }).catch(() => finish({ ok: false, reason: 'play_error' }));
                };

                const onError = () => finish({ ok: false, reason: 'network_error' });

                const cleanup = () => {
                    clearTimeout(timer);
                    audio.removeEventListener('loadedmetadata', onLoadedMetadata);
                    audio.removeEventListener('error', onError);
                };

                audio.pause();
                audio.addEventListener('loadedmetadata', onLoadedMetadata, { once: true });
                audio.addEventListener('error', onError, { once: true });
                audio.src = url;
                audio.load();
            });
        }

        function togglePlay() {
            if (!currentPlayingSong && viewList.length > 0) {
                startPlayFromView(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                setPlayButtonVisual(true);
            } else {
                audio.pause();
                setPlayButtonVisual(false);
            }
        }

        function prevSong() {
            if (!playingQueue.length && viewList.length) {
                playingQueue = [...viewList];
                playingIndex = 0;
            }
            if (!playingQueue.length) return;
            if (isShuffleMode && playingQueue.length > 1) {
                let nextIdx = playingIndex;
                while (nextIdx === playingIndex) {
                    nextIdx = Math.floor(Math.random() * playingQueue.length);
                }
                playSongInQueue(nextIdx);
            } else {
                playSongInQueue((playingIndex - 1 + playingQueue.length) % playingQueue.length);
            }
        }

        function nextSong() {
            if (!playingQueue.length && viewList.length) {
                playingQueue = [...viewList];
                playingIndex = -1;
            }
            if (!playingQueue.length) return;
            if (isShuffleMode && playingQueue.length > 1) {
                let nextIdx = playingIndex;
                while (nextIdx === playingIndex) {
                    nextIdx = Math.floor(Math.random() * playingQueue.length);
                }
                playSongInQueue(nextIdx);
            } else {
                playSongInQueue((playingIndex + 1) % playingQueue.length);
            }
        }

        /* ================= 主题与音量控制 ================= */
        let lastVolume = 1;

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
            const prefersDark = !!(window.matchMedia
                && window.matchMedia('(prefers-color-scheme: dark)').matches);
            applyTheme(saved || (prefersDark ? 'dark' : 'light'));
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const btn = document.getElementById('themeToggle');
            if (btn) btn.title = theme === 'dark' ? '切换到浅色主题' : '切换到深色主题';
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            applyTheme(next);
            try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        }

        function applyVolume(val) {
            const v = Math.max(0, Math.min(1, val));
            audio.volume = v;
            const bar = document.getElementById('volumeBar');
            const btn = document.getElementById('volumeBtn');
            if (bar) bar.value = String(Math.round(v * 100));
            if (btn) btn.classList.toggle('is-muted', v === 0);
        }

        function initVolume() {
            let stored = null;
            try { stored = localStorage.getItem(VOLUME_KEY); } catch (e) {}
            const v = stored === null ? 1 : parseFloat(stored);
            lastVolume = (isFinite(v) && v > 0) ? v : 1;
            applyVolume(isFinite(v) ? v : 1);

            const bar = document.getElementById('volumeBar');
            if (!bar) return;
            bar.addEventListener('input', () => {
                const nv = Number(bar.value) / 100;
                if (nv > 0) lastVolume = nv;
                applyVolume(nv);
                try { localStorage.setItem(VOLUME_KEY, String(nv)); } catch (e) {}
            });
        }

        function toggleMute() {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                applyVolume(0);
            } else {
                applyVolume(lastVolume > 0 ? lastVolume : 1);
            }
            try { localStorage.setItem(VOLUME_KEY, String(audio.volume)); } catch (e) {}
        }

        function setupHeadsetMediaSession() {
            if (!('mediaSession' in navigator)) return;

            const actionHandlers = [
                ['play', () => {
                    if (!currentPlayingSong && viewList.length > 0) {
                        startPlayFromView(0);
                    } else {
                        audio.play();
                        setPlayButtonVisual(true);
                    }
                }],
                ['pause', () => {
                    audio.pause();
                    setPlayButtonVisual(false);
                }],
                ['nexttrack', () => nextSong()],
                ['previoustrack', () => prevSong()],
                ['seekto', (details) => {
                    if (details.seekTime && audio.duration) {
                        audio.currentTime = details.seekTime;
                    }
                }]
            ];

            for (const [action, handler] of actionHandlers) {
                try {
                    navigator.mediaSession.setActionHandler(action, handler);
                } catch (e) {}
            }
        }

        function updateMediaSession(song) {
            if (!('mediaSession' in navigator) || !song) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: song.artist,
                album: 'OneMusic',
                artwork: [
                    { src: song.cover, sizes: '96x96', type: 'image/jpeg' },
                    { src: song.cover, sizes: '256x256', type: 'image/jpeg' },
                    { src: song.cover, sizes: '512x512', type: 'image/jpeg' }
                ]
            });
            setupHeadsetMediaSession();
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && audio.duration > MIN_VALID_DURATION) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                curTimeEl.innerText = formatTime(audio.currentTime);
                durTimeEl.innerText = formatTime(audio.duration);
                syncLyricProgress(audio.currentTime);

                if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                    try {
                        navigator.mediaSession.setPositionState({
                            duration: audio.duration,
                            playbackRate: audio.playbackRate || 1,
                            position: audio.currentTime
                        });
                    } catch (e) {}
                }
            }
        });

        audio.addEventListener('pause', () => setPlayButtonVisual(false));
        audio.addEventListener('play', () => setPlayButtonVisual(true));
        audio.addEventListener('ended', () => nextSong());

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        setupHeadsetMediaSession();
        loadFavorites();
        initTheme();
        initVolume();
        switchTab('cn');
    </script>
</body>
</html>
