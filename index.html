<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>媒体播控诊断</title>
<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html { width: 100%; overflow-x: hidden; }
  body {
    width: 100%; max-width: 100%;
    overflow-x: hidden;
    margin: 0;
    padding: 18px 16px calc(30px + env(safe-area-inset-bottom));
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #17171a; color: #ececf1;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: #8b8b96; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
  .card { background: #202026; border-radius: 12px; padding: 2px 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #2c2c34; align-items: flex-start; }
  .row:last-child { border-bottom: 0; }
  .k { color: #9a9aa6; flex: 0 0 auto; font-size: 13.5px; }
  .v { margin-left: auto; text-align: right; font-size: 13.5px; word-break: break-word; overflow-wrap: anywhere; min-width: 0; max-width: 66%; }
  .ok { color: #4ade80; }
  .bad { color: #f87171; }
  .warn { color: #fbbf24; }
  button {
    width: 100%; padding: 15px; font-size: 16px; font-weight: 500; font-family: inherit;
    border: 0; border-radius: 12px; background: #3b6ef0; color: #fff; margin: 4px 0 10px;
    cursor: pointer;
  }
  button:active { transform: scale(.985); }
  button.ghost { background: #2a2a32; margin-bottom: 14px; }
  button:disabled { opacity: .45; }
  #log {
    font: 12px/1.65 ui-monospace, Consolas, monospace; color: #8b8b96; white-space: pre-wrap;
    background: #1c1c22; border-radius: 10px; padding: 12px; max-height: 40vh; overflow: auto;
    margin-top: 4px;
  }
  .verdict { border-radius: 12px; padding: 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.7; display: none; }
  .verdict.show { display: block; }
  .verdict.good { background: #12301f; color: #86efac; }
  .verdict.badbox { background: #33161a; color: #fca5a5; }
  .verdict.mid { background: #33290f; color: #fcd34d; }
  .note { font-size: 12px; color: #8b8b96; line-height: 1.75; margin-top: 10px; }
  code { background: #2a2a32; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<h1>媒体播控诊断</h1>
<div class="sub">用来判断「锁屏 / 控制中心的媒体卡片」为什么没有出现。<br>这个卡片是系统界面，网页只能通过 Media Session API 让它显示。</div>

<div class="card" id="envCard"></div>

<button id="startBtn">① 开始测试（播放测试音频）</button>
<button id="stopBtn" class="ghost">② 停止测试</button>

<div class="verdict" id="verdict"></div>

<div class="card" id="stateCard"></div>

<div id="log"></div>

<div class="note">
  <b>怎么判断：</b><br>
  · 点 ① 后，立刻下拉控制中心，看媒体卡片是否变成测试歌曲<br>
  · 若「Media Session 可用」为绿色、动作全部注册成功，但卡片仍不显示 → 属于浏览器/系统的限制<br>
  · 若「Media Session 可用」为红色 → 当前浏览器根本不支持，需要换 Chrome / Edge 内核浏览器<br>
  · 测试音频是程序生成的提示音，不需要联网
</div>

<audio id="probe" preload="metadata" playsinline></audio>

<script>
(function () {
  'use strict';

  const probe = document.getElementById('probe');
  const envCard = document.getElementById('envCard');
  const stateCard = document.getElementById('stateCard');
  const logEl = document.getElementById('log');
  const verdict = document.getElementById('verdict');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');

  function log(msg) {
    logEl.textContent += (logEl.textContent ? '\n' : '') + msg;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function row(k, v, cls) {
    return '<div class="row"><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>';
  }

  function ok(v) { return '<span class="ok">' + v + '</span>'; }
  function bad(v) { return '<span class="bad">' + v + '</span>'; }
  function warn(v) { return '<span class="warn">' + v + '</span>'; }

  /* ---------- 1. 环境检测 ---------- */
  const hasMS = ('mediaSession' in navigator);
  const hasSAH = !!(navigator.mediaSession && typeof navigator.mediaSession.setActionHandler === 'function');
  const hasSPS = !!(navigator.mediaSession && typeof navigator.mediaSession.setPositionState === 'function');
  const hasMM = (typeof window.MediaMetadata === 'function');

  let html = '';
  html += row('HTTPS 安全环境', window.isSecureContext ? ok('是') : bad('否（必需）'));
  html += row('Media Session', hasMS ? ok('可用') : bad('不存在'));
  html += row('setActionHandler', hasSAH ? ok('是') : bad('否'));
  html += row('setPositionState', hasSPS ? ok('支持（可显示进度）') : warn('不支持'));
  html += row('MediaMetadata', hasMM ? ok('是') : bad('否'));
  html += row('浏览器标识', '<span style="font-size:11px">' + navigator.userAgent.replace(/</g, '&lt;') + '</span>');
  envCard.innerHTML = html;

  log('环境检测完成');
  log('secureContext=' + window.isSecureContext);
  log('mediaSession=' + hasMS + ' setActionHandler=' + hasSAH + ' setPositionState=' + hasSPS);

  /* ---------- 2. 生成测试音频（WAV，无需联网） ---------- */
  function makeTone(seconds, freq) {
    const rate = 8000;
    const n = Math.floor(rate * seconds);
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE');
    ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    ws(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      // 加淡入淡出，避免爆音
      const env = Math.min(1, i / (rate * 0.05), (n - i) / (rate * 0.05));
      const s = Math.sin(2 * Math.PI * freq * i / rate) * 0.25 * env;
      v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true);
    }
    const bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return 'data:audio/wav;base64,' + btoa(bin);
  }

  const TONE_URL = makeTone(8, 440);

  /* ---------- 3. 测试流程 ---------- */
  const ACTIONS = [
    'play', 'pause', 'nexttrack', 'previoustrack',
    'seekbackward', 'seekforward', 'seekto',
    'stop', 'togglefavorite'
  ];

  const results = {};
  let registered = false;

  function registerHandlers() {
    if (!hasSAH) return false;
    let success = 0;
    ACTIONS.forEach(function (action) {
      try {
        navigator.mediaSession.setActionHandler(action, function (details) {
          log('系统触发动作: ' + action + (details ? ' ' + JSON.stringify(details) : ''));
          if (action === 'play') {
            probe.play().catch(function () {});
          } else if (action === 'pause' || action === 'stop') {
            probe.pause();
          } else if (action === 'seekforward') {
            probe.currentTime = Math.min(probe.duration || 0, probe.currentTime + 2);
          } else if (action === 'seekbackward') {
            probe.currentTime = Math.max(0, probe.currentTime - 2);
          } else if (action === 'seekto' && details && typeof details.seekTime === 'number') {
            probe.currentTime = details.seekTime;
          }
        });
        results[action] = 'ok';
        success++;
      } catch (e) {
        results[action] = '不支持';
      }
    });
    registered = success > 0;
    log('动作注册成功 ' + success + ' / ' + ACTIONS.length);
    return registered;
  }

  function setMeta() {
    if (!hasMM || !hasMS) return false;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: '诊断测试歌曲',
        artist: 'OneMusic 诊断',
        album: 'Media Session Test',
        artwork: []
      });
      log('metadata 写入成功');
      return true;
    } catch (e) {
      log('metadata 写入失败: ' + e.message);
      return false;
    }
  }

  function postPosition() {
    if (!hasSPS) return;
    const d = probe.duration;
    if (!d || !isFinite(d) || d <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: d,
        playbackRate: probe.playbackRate || 1,
        position: Math.min(probe.currentTime || 0, d)
      });
    } catch (e) {}
  }

  function renderState() {
    let h = '';
    h += row('音频已就绪', probe.readyState >= 1 ? ok('是') : warn('否'));
    h += row('音频时长', probe.duration && isFinite(probe.duration) ? ok(probe.duration.toFixed(2) + ' 秒') : warn('未知'));
    h += row('播放状态', probe.paused ? warn('暂停') : ok('正在播放'));
    h += row('playbackState', '<span class="v">' + (hasMS ? (navigator.mediaSession.playbackState || 'none') : '-') + '</span>');
    h += row('系统元数据标题', hasMS && navigator.mediaSession.metadata ? ok(navigator.mediaSession.metadata.title) : bad('未设置'));
    Object.keys(results).forEach(function (a) {
      const good = results[a] === 'ok';
      h += row('动作 ' + a, good ? ok('已注册') : bad(results[a]));
    });
    stateCard.innerHTML = h;
  }

  function showVerdict() {
    verdict.className = 'verdict show';
    if (!hasMS || !hasSAH) {
      verdict.classList.add('badbox');
      verdict.innerHTML = '<b>当前浏览器不支持 Media Session。</b><br>这台设备上的这个浏览器无法让网页内容显示在锁屏/控制中心媒体卡片里。<br>请改用 Chrome 或 Edge（安卓版）再试。';
    } else if (!registered) {
      verdict.classList.add('badbox');
      verdict.innerHTML = '<b>Media Session 存在，但所有动作都注册失败。</b><br>浏览器限制了媒体控制，换浏览器测试。';
    } else if (probe.paused) {
      verdict.classList.add('mid');
      verdict.innerHTML = '<b>已注册，但音频没有在播放。</b><br>点 ① 后请确认页面确实在出声，再下拉控制中心看卡片。';
    } else {
      verdict.classList.add('good');
      verdict.innerHTML = '<b>已注册并且正在播放。</b><br>现在立刻下拉控制中心，看媒体卡片是否显示「诊断测试歌曲」。<br>如果仍然显示「未在播放」，说明该系统/浏览器屏蔽了网页媒体会话。';
    }
  }

  startBtn.addEventListener('click', function () {
    log('--- 开始测试 ---');
    startBtn.disabled = true;

    probe.src = TONE_URL;
    probe.load();

    const onReady = function () {
      log('音频元数据已加载，duration=' + probe.duration);
      probe.play().then(function () {
        log('play() 成功');
        registerHandlers();
        setMeta();
        postPosition();
        renderState();
        showVerdict();
        startBtn.disabled = false;
      }).catch(function (e) {
        log('play() 失败: ' + e.message);
        renderState();
        showVerdict();
        startBtn.disabled = false;
      });
    };

    if (probe.readyState >= 1) {
      onReady();
    } else {
      probe.addEventListener('loadedmetadata', onReady, { once: true });
      setTimeout(function () {
        if (probe.readyState < 1) {
          log('等待元数据超时，仍尝试播放');
          onReady();
        }
      }, 2500);
    }
  });

  stopBtn.addEventListener('click', function () {
    probe.pause();
    renderState();
    log('已暂停');
  });

  probe.addEventListener('timeupdate', postPosition);
  probe.addEventListener('play', function () { log('事件: play'); renderState(); });
  probe.addEventListener('pause', function () { log('事件: pause'); renderState(); });
  probe.addEventListener('ended', function () { log('事件: ended'); renderState(); });
  probe.addEventListener('error', function () {
    log('音频错误: ' + (probe.error ? probe.error.code : '?'));
    renderState();
  });

  renderState();
})();
</script>
</body>
</html>
