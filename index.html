<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneMusic</title>
    <style>
        /* ============================================================
           OneMusic · 设计令牌（Design Tokens）
           字号 5 级 / 字重 3 级 / 圆角 4 级 / 间距 5 级
           ============================================================ */
        :root {
            /* 字体 · 含 Windows/Android 中文字体回退 */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
                         "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                         "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC",
                         "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono",
                         Consolas, "Liberation Mono", monospace;

            /* 字号 · 5 级 */
            --fs-xs: 0.75rem;
            --fs-sm: 0.8125rem;
            --fs-md: 0.9375rem;
            --fs-lg: 1.0625rem;
            --fs-xl: 1.375rem;

            /* 字重 · 3 级（中文上限 600，避免合成伪粗体） */
            --fw-regular: 400;
            --fw-medium: 500;
            --fw-bold: 600;

            /* 圆角 · 4 级 */
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-full: 999px;

            /* 间距 · 5 级 */
            --sp-1: 4px;
            --sp-2: 8px;
            --sp-3: 12px;
            --sp-4: 16px;
            --sp-5: 24px;

            /* 版面最大宽度（顶栏 / 列表 / 播放栏统一） */
            --page-max: 960px;

            /* 动效 */
            --ease: cubic-bezier(0.2, 0, 0.2, 1);
            --dur-fast: 120ms;
            --dur: 180ms;

            /* 语义色 · 浅色 */
            --bg: #f6f7f9;
            --bg-elev: #ffffff;
            --bg-sunken: #eef1f5;
            --bg-hover: #f1f4f8;
            --border: #e4e9f0;
            --border-strong: #cdd7e3;
            --text: #111827;
            --text-2: #5b6779;
            --text-3: #8794a6;

            --accent: #0b7fd4;
            --accent-hover: #0a6fb9;
            --accent-soft: #e8f3fd;
            --accent-border: #b7dcf7;
            --accent-contrast: #ffffff;

            --danger: #e11d48;
            --danger-soft: #fdf0f3;
            --danger-border: #f8c6d2;
            --danger-contrast: #ffffff;

            --success: #0f9d6b;
            --success-soft: #e9f8f2;
            --success-border: #b3e6d3;

            --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.05);
            --shadow-2: 0 4px 16px rgba(16, 24, 40, 0.07);
            --shadow-3: 0 12px 40px rgba(16, 24, 40, 0.13);

            --glass: rgba(255, 255, 255, 0.82);
            --mask: rgba(15, 23, 42, 0.42);
            --track: #d8e0ea;

            color-scheme: light;

            /* 旧变量名别名：保证 JS 内联样式里的引用不失效 */
            --bg-main: var(--bg);
            --bg-glass: var(--glass);
            --bg-card: var(--bg-elev);
            --bg-card-hover: var(--bg-hover);
            --accent-light: var(--accent-soft);
            --accent-glow: rgba(11, 127, 212, 0.18);
            --fav-red: var(--danger);
            --green: var(--success);
            --text-primary: var(--text);
            --text-secondary: var(--text-2);
            --border-color: var(--border);
            --shadow-sm: var(--shadow-1);
            --shadow-md: var(--shadow-3);
        }

        [data-theme="dark"] {
            --bg: #0c1118;
            --bg-elev: #151c26;
            --bg-sunken: #1b2331;
            --bg-hover: #212b3a;
            --border: #252f3e;
            --border-strong: #354255;
            --text: #e9eef6;
            --text-2: #9aa7b8;
            --text-3: #6b7a8d;

            --accent: #58b4ff;
            --accent-hover: #7cc4ff;
            --accent-soft: #12293d;
            --accent-border: #1f4a6b;
            --accent-contrast: #06131f;

            --danger: #fb7185;
            --danger-soft: #2a1219;
            --danger-border: #4a1f2b;
            --danger-contrast: #2a0812;

            --success: #34d399;
            --success-soft: #0e2a22;
            --success-border: #1b4d3e;

            --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.5);
            --shadow-3: 0 12px 40px rgba(0, 0, 0, 0.6);

            --glass: rgba(12, 17, 24, 0.82);
            --mask: rgba(0, 0, 0, 0.62);
            --track: #2b3648;

            --accent-glow: rgba(88, 180, 255, 0.22);

            color-scheme: dark;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-sans);
            font-size: var(--fs-md);
            font-weight: var(--fw-regular);
            line-height: 1.5;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ---------- 可访问性：键盘焦点 ---------- */
        :where(button, input, select, [tabindex]):focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ---------- 顶栏 ---------- */
        header {
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid var(--border);
            padding: var(--sp-3) var(--sp-4);
            z-index: 20;
            flex-shrink: 0;
        }

        /* 顶栏 / 主区 / 播放栏共用同一居中宽度，保证左右边缘对齐 */
        .header-container,
        .player-inner,
        .lyric-header,
        .lyric-body {
            max-width: var(--page-max);
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            flex-shrink: 0;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: var(--r-sm);
            background: linear-gradient(150deg, var(--accent), var(--accent-hover));
            display: grid;
            place-items: center;
            color: var(--accent-contrast);
            flex-shrink: 0;
        }

        .brand-mark svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            display: block;
        }

        .brand-title {
            font-size: var(--fs-lg);
            font-weight: var(--fw-bold);
            letter-spacing: -0.01em;
            color: var(--text);
            line-height: 1.2;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            background: var(--bg-sunken);
            border: 1px solid transparent;
            border-radius: var(--r-full);
            padding: 3px 4px 3px var(--sp-3);
            flex: 1;
            max-width: 420px;
            margin-left: auto;
            min-width: 0;
            transition: background var(--dur) var(--ease),
                        border-color var(--dur) var(--ease),
                        box-shadow var(--dur) var(--ease);
        }

        .search-bar:focus-within {
            background: var(--bg-elev);
            border-color: var(--accent-border);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search-input {
            flex: 1;
            min-width: 0;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 5px 0;
            font-size: var(--fs-sm);
            font-family: inherit;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-3);
        }

        .search-btn {
            background: var(--accent);
            color: var(--accent-contrast);
            border: none;
            padding: 6px 14px;
            border-radius: var(--r-full);
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            font-family: inherit;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
            transition: background var(--dur-fast) var(--ease);
        }

        .search-btn:hover {
            background: var(--accent-hover);
        }

        .theme-toggle {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: var(--r-full);
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-2);
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease),
                        color var(--dur-fast) var(--ease);
        }

        .theme-toggle:hover {
            background: var(--bg-sunken);
            color: var(--text);
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            display: block;
        }

        .theme-toggle .ico-sun { display: none; }
        [data-theme="dark"] .theme-toggle .ico-sun { display: block; }
        [data-theme="dark"] .theme-toggle .ico-moon { display: none; }

        .market-nav {
            display: flex;
            gap: var(--sp-2);
            overflow-x: auto;
            scrollbar-width: none;
            width: 100%;
            padding-bottom: 1px;
        }

        .market-nav::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            flex: 1;
            min-width: 84px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: transparent;
            color: var(--text-2);
            border: 1px solid var(--border);
            padding: 7px 10px;
            border-radius: var(--r-md);
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: background var(--dur-fast) var(--ease),
                        color var(--dur-fast) var(--ease),
                        border-color var(--dur-fast) var(--ease);
        }

        .tab-btn:hover {
            background: var(--bg-sunken);
            color: var(--text);
        }

        .tab-btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--accent-contrast);
            border-color: var(--accent);
        }

        .tab-btn.fav-tab.active {
            background: var(--danger);
            color: var(--danger-contrast);
            border-color: var(--danger);
        }

        /* ---------- 主区域 ---------- */
        /* main 自身承担左右内边距，因此外框宽度要额外加上两份 padding，
           这样内容左边缘才与顶栏、播放栏完全对齐 */
        main {
            flex: 1;
            overflow-y: auto;
            padding: var(--sp-4) var(--sp-4) 140px;
            max-width: calc(var(--page-max) + 2 * var(--sp-4));
            width: 100%;
            margin: 0 auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
        }

        .banner-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: var(--sp-3) var(--sp-4);
            margin-bottom: var(--sp-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--sp-3);
            flex-wrap: wrap;
        }

        .banner-info h2 {
            font-size: var(--fs-lg);
            font-weight: var(--fw-bold);
            color: var(--text);
        }

        .banner-actions {
            display: flex;
            gap: var(--sp-2);
            align-items: center;
            flex-wrap: wrap;
            position: relative;
        }

        .sub-source-select {
            background: var(--bg-sunken);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 10px;
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            font-family: inherit;
            outline: none;
            cursor: pointer;
            max-width: 100%;
            transition: border-color var(--dur-fast) var(--ease);
        }

        .sub-source-select:hover {
            border-color: var(--border-strong);
        }

        .play-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent);
            color: var(--accent-contrast);
            border: none;
            padding: 8px 14px;
            border-radius: var(--r-sm);
            font-weight: var(--fw-medium);
            font-size: var(--fs-sm);
            font-family: inherit;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease);
        }

        .play-all-btn:hover {
            background: var(--accent-hover);
        }

        .play-all-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .cloud-wrap {
            position: relative;
            display: none;
        }

        .cloud-trigger-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-sunken);
            color: var(--text-2);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            font-family: inherit;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease),
                        color var(--dur-fast) var(--ease),
                        border-color var(--dur-fast) var(--ease);
        }

        .cloud-trigger-btn:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .cloud-trigger-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .cloud-trigger-btn.connected {
            color: var(--success);
            border-color: var(--success-border);
            background: var(--success-soft);
        }

        .cloud-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-3);
            z-index: 50;
            width: 132px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            padding: 4px;
        }

        .cloud-dropdown.open {
            display: flex;
        }

        .cloud-row-btn {
            width: 100%;
            padding: 9px 12px;
            background: transparent;
            border: none;
            border-radius: var(--r-sm);
            color: var(--text);
            font-size: var(--fs-sm);
            font-family: inherit;
            font-weight: var(--fw-regular);
            text-align: left;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease);
        }

        .cloud-row-btn:hover:not(:disabled) {
            background: var(--bg-sunken);
        }

        .cloud-row-btn:disabled {
            color: var(--text-3);
            cursor: not-allowed;
        }

        /* ---------- 歌曲列表 ---------- */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .song-item {
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--r-md);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--sp-3);
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease),
                        border-color var(--dur-fast) var(--ease);
        }

        .song-item:hover {
            background: var(--bg-elev);
            border-color: var(--border);
        }

        .song-item.active {
            background: var(--accent-soft);
            border-color: var(--accent-border);
        }

        .song-left {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            min-width: 0;
            flex: 1;
        }

        .rank {
            width: 22px;
            text-align: center;
            font-family: var(--font-mono);
            font-weight: var(--fw-medium);
            font-size: var(--fs-xs);
            color: var(--text-3);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .cover {
            width: 40px;
            height: 40px;
            border-radius: var(--r-sm);
            object-fit: cover;
            background: var(--bg-sunken);
            flex-shrink: 0;
        }

        .meta {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
            flex: 1;
        }

        .title {
            font-size: var(--fs-md);
            font-weight: var(--fw-medium);
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist {
            font-size: var(--fs-sm);
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-right {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            flex-shrink: 0;
        }

        .badge {
            font-size: var(--fs-xs);
            padding: 2px 8px;
            border-radius: var(--r-full);
            background: var(--bg-sunken);
            color: var(--text-2);
            border: 1px solid var(--border);
            white-space: nowrap;
        }

        .badge.full-verified {
            color: var(--success);
            border-color: var(--success-border);
            background: var(--success-soft);
        }

        .fav-btn {
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            cursor: pointer;
            border-radius: var(--r-full);
            color: var(--text-3);
            transition: color var(--dur-fast) var(--ease),
                        background var(--dur-fast) var(--ease),
                        transform var(--dur-fast) var(--ease);
        }

        .fav-btn:hover {
            background: var(--bg-sunken);
            color: var(--danger);
        }

        .fav-btn:active {
            transform: scale(0.9);
        }

        .fav-btn svg {
            width: 17px;
            height: 17px;
            display: block;
        }

        .fav-btn .ico-heart-fill { display: none; }

        .fav-btn.is-fav {
            color: var(--danger);
        }

        .fav-btn.is-fav .ico-heart { display: none; }
        .fav-btn.is-fav .ico-heart-fill { display: block; }

        /* ---------- 底部播放栏 ---------- */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid var(--border);
            padding: var(--sp-2) var(--sp-4) calc(var(--sp-3) + env(safe-area-inset-bottom, 0px));
            z-index: 35;
        }

        .player-inner {
            display: flex;
            flex-direction: column;
            gap: var(--sp-2);
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: var(--sp-2);
            font-size: var(--fs-xs);
            color: var(--text-3);
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            flex: 1;
            min-width: 50px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--track);
            border-radius: var(--r-full);
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg-elev);
            box-shadow: var(--shadow-1);
            cursor: pointer;
            transition: transform var(--dur-fast) var(--ease);
        }

        .progress-bar:hover::-webkit-slider-thumb {
            transform: scale(1.15);
        }

        .progress-bar::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--bg-elev);
            cursor: pointer;
        }

        .progress-bar::-moz-range-track {
            height: 4px;
            background: var(--track);
            border-radius: var(--r-full);
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            padding-left: var(--sp-2);
            border-left: 1px solid var(--border);
            margin-left: var(--sp-1);
        }

        .volume-btn {
            background: transparent;
            border: none;
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            cursor: pointer;
            border-radius: var(--r-full);
            color: var(--text-2);
            transition: color var(--dur-fast) var(--ease),
                        background var(--dur-fast) var(--ease);
        }

        .volume-btn:hover {
            color: var(--text);
            background: var(--bg-sunken);
        }

        .volume-btn svg {
            width: 15px;
            height: 15px;
            display: block;
        }

        .volume-btn .ico-vol-mute { display: none; }
        .volume-btn.is-muted .ico-vol-on { display: none; }
        .volume-btn.is-muted .ico-vol-mute { display: block; }

        .volume-bar {
            width: 72px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--track);
            border-radius: var(--r-full);
            outline: none;
            cursor: pointer;
        }

        .volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--text-2);
            border: none;
            cursor: pointer;
        }

        .volume-bar::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--text-2);
            border: none;
            cursor: pointer;
        }

        .volume-bar::-moz-range-track {
            height: 4px;
            background: var(--track);
            border-radius: var(--r-full);
        }

        .player-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--sp-3);
        }

        .np-left {
            display: flex;
            align-items: center;
            gap: var(--sp-3);
            min-width: 0;
            flex: 1;
            cursor: pointer;
            border-radius: var(--r-md);
            padding: 2px;
            transition: background var(--dur-fast) var(--ease);
        }

        .np-left:hover {
            background: var(--bg-sunken);
        }

        .np-cover {
            width: 42px;
            height: 42px;
            border-radius: var(--r-sm);
            object-fit: cover;
            background: var(--bg-sunken);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .np-meta {
            min-width: 0;
            flex: 1;
        }

        .np-title {
            font-size: var(--fs-md);
            font-weight: var(--fw-medium);
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .np-lyric-mini {
            font-size: var(--fs-xs);
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .np-controls {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-2);
            width: 34px;
            height: 34px;
            border-radius: var(--r-full);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease),
                        color var(--dur-fast) var(--ease);
        }

        .ctrl-btn:hover {
            background: var(--bg-sunken);
            color: var(--text);
        }

        .ctrl-btn svg {
            width: 17px;
            height: 17px;
            display: block;
        }

        /* 顺序/随机共用同一个按钮：默认显示循环，开启随机后互斥切换到随机图标 */
        .ctrl-btn > .ico-repeat { display: block; }
        .ctrl-btn > .ico-shuffle { display: none; }

        .ctrl-btn.is-shuffle,
        .ctrl-btn.mode-active {
            color: var(--accent);
        }

        .ctrl-btn.is-shuffle > .ico-repeat,
        .ctrl-btn.mode-active > .ico-repeat { display: none; }

        .ctrl-btn.is-shuffle > .ico-shuffle,
        .ctrl-btn.mode-active > .ico-shuffle { display: block; }

        .play-pause-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
            margin: 0 2px;
            transition: transform var(--dur-fast) var(--ease),
                        background var(--dur-fast) var(--ease);
        }

        .play-pause-circle:hover {
            background: var(--accent-hover);
        }

        .play-pause-circle:active {
            transform: scale(0.94);
        }

        .play-pause-circle svg {
            width: 19px;
            height: 19px;
            fill: var(--accent-contrast);
            display: block;
        }

        .skip-btn-circle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: grid;
            place-items: center;
            cursor: pointer;
            padding: 0;
            color: var(--text-2);
            transition: background var(--dur-fast) var(--ease),
                        color var(--dur-fast) var(--ease);
        }

        .skip-btn-circle:hover {
            background: var(--bg-sunken);
            color: var(--text);
        }

        .skip-btn-circle svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
            display: block;
        }

        /* ---------- 歌词视图 ---------- */
        .lyric-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 32;
            display: none;
            flex-direction: column;
            padding: var(--sp-4);
            padding-bottom: 140px;
        }

        .lyric-overlay.open {
            display: flex;
            animation: overlay-in var(--dur) var(--ease);
        }

        @keyframes overlay-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lyric-header {
            margin: 0 auto var(--sp-3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .lyric-header-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            color: var(--text-2);
        }

        .lyric-header-label svg {
            width: 15px;
            height: 15px;
            display: block;
        }

        .lyric-close-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-sunken);
            border: 1px solid var(--border);
            color: var(--text-2);
            padding: 6px 12px;
            border-radius: var(--r-full);
            font-size: var(--fs-xs);
            font-weight: var(--fw-medium);
            font-family: inherit;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease),
                        color var(--dur-fast) var(--ease);
        }

        .lyric-close-btn:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .lyric-close-btn svg {
            width: 11px;
            height: 11px;
            display: block;
        }

        .lyric-body {
            flex: 1;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--sp-5);
            align-items: center;
            overflow: hidden;
            min-height: 0;
        }

        .lyric-art-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: var(--sp-3);
        }

        .lyric-big-cover {
            width: 220px;
            height: 220px;
            border-radius: var(--r-lg);
            object-fit: cover;
            box-shadow: var(--shadow-3);
            background: var(--bg-sunken);
        }

        .lyric-song-title {
            font-size: var(--fs-lg);
            font-weight: var(--fw-bold);
            color: var(--text);
        }

        .lyric-song-artist {
            font-size: var(--fs-sm);
            color: var(--text-2);
        }

        .lyric-scroll-col {
            height: 100%;
            overflow-y: auto;
            padding: 40% 12px;
            scroll-behavior: smooth;
            text-align: center;
            scrollbar-width: none;
        }

        .lyric-scroll-col::-webkit-scrollbar {
            display: none;
        }

        .lyric-line {
            padding: 9px 8px;
            font-size: var(--fs-md);
            color: var(--text-3);
            transition: color var(--dur) var(--ease),
                        font-size var(--dur) var(--ease);
            cursor: pointer;
            border-radius: var(--r-sm);
            line-height: 1.6;
        }

        .lyric-line:hover {
            color: var(--text-2);
        }

        .lyric-line.active {
            font-size: var(--fs-lg);
            font-weight: var(--fw-bold);
            color: var(--text);
        }

        /* ---------- 云链接配置弹窗 ---------- */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: var(--mask);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: var(--sp-4);
        }

        .modal-mask.open {
            display: flex;
        }

        .modal-card {
            background: var(--bg-elev);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            width: 100%;
            max-width: 420px;
            padding: var(--sp-5);
            box-shadow: var(--shadow-3);
            display: flex;
            flex-direction: column;
            gap: var(--sp-3);
        }

        .modal-card h3 {
            font-size: var(--fs-lg);
            font-weight: var(--fw-bold);
            color: var(--text);
        }

        .modal-card p {
            font-size: var(--fs-xs);
            color: var(--text-2);
            line-height: 1.5;
        }

        .modal-card code {
            font-family: var(--font-mono);
            font-size: 0.95em;
            background: var(--bg-sunken);
            padding: 1px 5px;
            border-radius: 4px;
            color: var(--text);
        }

        .repo-grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr 76px;
            gap: var(--sp-2);
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .form-group label {
            font-size: var(--fs-xs);
            font-weight: var(--fw-medium);
            color: var(--text-2);
            white-space: nowrap;
        }

        .form-group input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            font-family: inherit;
            outline: none;
            background: var(--bg-sunken);
            color: var(--text);
            transition: background var(--dur-fast) var(--ease),
                        border-color var(--dur-fast) var(--ease),
                        box-shadow var(--dur-fast) var(--ease);
        }

        .form-group input:focus {
            background: var(--bg-elev);
            border-color: var(--accent-border);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: var(--sp-2);
            margin-top: var(--sp-1);
        }

        .btn-secondary {
            background: var(--bg-sunken);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            font-family: inherit;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-contrast);
            border: none;
            padding: 8px 16px;
            border-radius: var(--r-sm);
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            font-family: inherit;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 720px) {
            header { padding: var(--sp-2) 12px; }
            .header-container { gap: var(--sp-2); }
            .brand-title { font-size: var(--fs-md); }
            .brand-mark { width: 24px; height: 24px; }
            .theme-toggle { width: 32px; height: 32px; }
            .search-bar { padding: 2px 3px 2px 10px; }
            .search-btn { padding: 5px 11px; font-size: var(--fs-xs); }
            .tab-btn { min-width: 70px; font-size: var(--fs-xs); padding: 6px 8px; gap: 4px; }
            .tab-btn svg { width: 13px; height: 13px; }
            main { padding: 12px 12px 136px; max-width: calc(var(--page-max) + 24px); }
            .banner-card { padding: var(--sp-2) var(--sp-3); }
            .badge { display: none; }
            .lyric-overlay { padding: 12px; padding-bottom: 136px; }
            .lyric-body { grid-template-columns: 1fr; gap: var(--sp-3); align-items: stretch; }
            .lyric-art-col {
                flex-direction: row;
                text-align: left;
                background: var(--bg-elev);
                padding: 10px 12px;
                border-radius: var(--r-md);
                border: 1px solid var(--border);
            }
            .lyric-big-cover {
                width: 48px;
                height: 48px;
                border-radius: var(--r-sm);
                box-shadow: none;
            }
            .lyric-scroll-col { padding: 60px 6px; }
            .repo-grid-row { grid-template-columns: 1fr 1fr 64px; gap: 6px; }
            .volume-bar { width: 54px; }
            .np-cover { width: 38px; height: 38px; }
            .np-title { font-size: var(--fs-sm); }
            .progress-wrap { gap: 6px; }
            .player-bar { padding: var(--sp-2) 12px calc(var(--sp-2) + env(safe-area-inset-bottom, 0px)); }
        }

        @media (max-width: 420px) {
            .volume-bar { width: 40px; }
            .np-lyric-mini { max-width: 40vw; }
        }

        /* ---------- 降低动效偏好 ---------- */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

    <!-- 图标库：内联 SVG symbol，替代 emoji -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <g id="stroke-props" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"></g>
        </defs>

        <symbol id="ico-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path>
        </symbol>

        <symbol id="ico-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor"

        </symbol>

        <symbol id="ico-heart-fill" viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"></path>
        </symbol>

        <symbol id="ico-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"

        <symbol id="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor"

            <path d="M5 5l14 14M19 5L5 19"></path>
        </symbol>

        <symbol id="ico-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor"

            <path d="M17 2l3 3-3 3"></path>
            <path d="M20 5H8a4 4 0 0 0-4 4v2"></path>
            <path d="M7 22l-3-3 3-3"></path>
            <path d="M4 19h12a4 4 0 0 0 4-4v-2"></path>

        <symbol id="ico-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor"

            <path d="M17 19l3 3-3 3"></path>

    <header>
        <div class="header-container">
            <div class="header-top">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true"><svg><use href="#ico-logo"></use></svg></span>
                    <div class="brand-title">OneMusic</div>
                </div>

                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索歌名或歌手"
                           aria-label="搜索歌名或歌手" autocomplete="off"
                           onkeydown="if(event.key==='Enter') doAggregatedSearch()">
                    <button class="search-btn" onclick="doAggregatedSearch()">搜索</button>
                </div>

                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换深色 / 浅色主题"
                        aria-label="切换深色或浅色主题">
                    <svg class="ico-moon"><use href="#ico-moon"></use></svg>
                    <svg class="ico-sun"><use href="#ico-sun"></use></svg>
                </button>
            </div>

            <div class="market-nav" role="tablist" aria-label="榜单切换">
                <button class="tab-btn active" id="tab-cn" onclick="switchTab('cn')" role="tab">
                    <svg aria-hidden="true"><use href="#ico-globe"></use></svg>华语榜
                </button>
                <button class="tab-btn" id="tab-jp" onclick="switchTab('jp')" role="tab">
                    <svg aria-hidden="true"><use href="#ico-globe"></use></svg>日语榜
                </button>
                <button class="tab-btn" id="tab-bb" onclick="switchTab('bb')" role="tab">
                    <svg aria-hidden="true"><use href="#ico-globe"></use></svg>欧美榜
                </button>
                <button class="tab-btn fav-tab" id="tab-fav" onclick="switchTab('fav')" role="tab">
                    <svg aria-hidden="true"><use href="#ico-heart"></use></svg>收藏 (<span id="favCount">0</span>)
                </button>
                <button class="tab-btn" id="tab-search" style="display:none;" onclick="switchTab('search')" role="tab">
                    <svg aria-hidden="true"><use href="#ico-search"></use></svg>结果
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="banner-card">
            <div class="banner-info">
                <h2 id="bannerTitle">华语榜</h2>
            </div>
            <div class="banner-actions">
                <select id="cnBoardSelect" class="sub-source-select" onchange="changeCnChart()" aria-label="华语榜单源">
                    <option value="meting_hot">原生 Meting · 华语热歌榜</option>
                    <option value="apple_tw">Apple Music · 台湾流行榜</option>
                    <option value="apple_hk">Apple Music · 香港流行榜</option>
                </select>

                <select id="bbBoardSelect" class="sub-source-select" style="display:none;"
                        onchange="changeBillboardChart()" aria-label="欧美榜单源">
                    <option value="60198">Billboard 公告牌周榜</option>

        // 全局底部随机播放开关（对所有榜单和收藏列表生效）

        async function requestMeting(paramsStr, timeout = 5500) {
            for (let endpoint of METING_ENDPOINTS) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeout);
                try {
                    const res = await fetch(`${endpoint}?${paramsStr}`, { signal: controller.signal });
                    clearTimeout(timer);
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) return data;
                } catch (e) {
                    clearTimeout(timer);
                }
            }
            return [];
        }

        async function searchGDStudio(keyword) {
            const sources = ['kuwo', 'tencent', 'kugou'];
            const results = [];
            const tasks = sources.map(async (srv) => {
                try {
                    const res = await fetch(`https://music-api.gdstudio.xyz/api.php?types=search&source=${srv}&name=${encodeURIComponent(keyword)}&count=2`);
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const first = data[0];
                        const urlRes = await fetch(`https://music-api.gdstudio.xyz/api.php?types=url&source=${srv}&id=${first.id}&br=320`);
                        const urlData = await urlRes.json();
                        if (urlData && urlData.url) {
                            results.push({
                                url: urlData.url,
                                label: `GD-${srv.toUpperCase()}·320k`,
                                lyricId: first.lyric_id || first.id,
                                srv: srv
                            });
                        }
                    }
                } catch (e) {}
            });
            await Promise.allSettled(tasks);
            return results;
        }

        /* ================= 收藏与穿透互补自动覆写采集链模块 ================= */
        function loadFavorites() {
            try {
                const raw = localStorage.getItem(FAV_STORAGE_KEY) || localStorage.getItem("MUSIC_HUB_FAVORITES_V5");
                favorites = raw ? JSON.parse(raw) : [];
            } catch (e) {
                favorites = [];
            }
            updateFavCountUI();
        }

        function saveFavorites() {
            localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favorites));
            updateFavCountUI();
        }

        function updateFavCountUI() {
            document.getElementById('favCount').innerText = favorites.length;
            const liked = currentPlayingSong ? isSongFavorited(currentPlayingSong) : false;
            npFavBtn.classList.toggle('is-fav', liked);
            npFavBtn.title = liked ? '取消收藏' : '收藏';
        }

        function getSongFingerprint(title, artist) {
            const cleanTitle = (title || '').replace(/\(.*?\)|（.*?）|\[.*?\]/g, '').trim().toLowerCase();
            const cleanArtist = (artist || '').split(/[\/&,、]/)[0].trim().toLowerCase();
            return `${cleanTitle}__${cleanArtist}`;
        }

        function isSongFavorited(song) {
            if (!song) return false;
            const fp = getSongFingerprint(song.title, song.artist);
            return favorites.some(f => getSongFingerprint(f.title, f.artist) === fp);
        }

        function isSameSong(songA, songB) {
            if (!songA || !songB) return false;
            return getSongFingerprint(songA.title, songA.artist) === getSongFingerprint(songB.title, songB.artist);
        }

        // 穿透互补核心：只要某首已收藏歌曲播放成功，永远将其收藏记录更新为最后一次实际播放成功的采集链
        function syncFavoriteLatestChain(song, latestSourceObj, durationSec) {
            if (!song || !latestSourceObj || !latestSourceObj.url) return;
            const fp = getSongFingerprint(song.title, song.artist);
            const favIdx = favorites.findIndex(f => getSongFingerprint(f.title, f.artist) === fp);
            if (favIdx > -1) {
                const cleanChain = { url: latestSourceObj.url, label: latestSourceObj.label || '直连链' };
                favorites[favIdx].sources = [cleanChain];
                favorites[favIdx].badgeText = `⚡ 锁定(${cleanChain.label})`;
                favorites[favIdx].verifiedFull = true;
                if (song.cover && !song.cover.includes('picsum.photos')) {
                    favorites[favIdx].cover = song.cover;
                }
                saveFavorites();
                if (currentTab === 'fav') {
                    viewList = [...favorites];
                }
            }
        }

        function toggleFavorite(song, event) {
            if (event) event.stopPropagation();
            if (!song) return;

            const fp = getSongFingerprint(song.title, song.artist);
            const idx = favorites.findIndex(f => getSongFingerprint(f.title, f.artist) === fp);

            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                let lockedSources = song.sources || [];
                if (currentPlayingSong && isSameSong(currentPlayingSong, song)) {
                    if (activeWorkingChain) {
                        lockedSources = [activeWorkingChain];
                    } else if (audio.src) {
                        lockedSources = [{ url: audio.src, label: "直连链" }];
                    }
                }
                favorites.unshift({
                    title: song.title,
                    artist: song.artist,
                    cover: song.cover,
                    sources: lockedSources.map(s => ({ url: s.url, label: s.label })),
                    badgeText: lockedSources.length > 0 ? `⚡ 锁定(${lockedSources[0].label})` : '已收藏',
                    verifiedFull: true
                });
            }
            saveFavorites();
            if (currentTab === 'fav') {
                viewList = [...favorites];
            }
            renderList();
        }

        function toggleCurrentFav() {
            if (currentPlayingSong) {
                toggleFavorite(currentPlayingSong);
            }
        }

        function toggleCloudMenu(e) {
            e.stopPropagation();
            document.getElementById('cloudDropdown').classList.toggle('open');
        }

        document.addEventListener('click', () => {
            const dd = document.getElementById('cloudDropdown');
            if (dd) dd.classList.remove('open');
        });

        function getCloudConfig() {
            try {
                const cfg = JSON.parse(localStorage.getItem(CLOUD_CFG_KEY));
                if (cfg && typeof cfg === 'object') return cfg;
            } catch (e) {}
            return { owner: '', repoName: '', branch: '', token: '' };

        async function saveCloudConfig() {
            const owner = document.getElementById('cfgOwner').value.trim();
            const repoName = document.getElementById('cfgRepoName').value.trim();
            const branch = document.getElementById('cfgBranch').value.trim() || 'main';
            const token = document.getElementById('cfgToken').value.trim();

            if (!owner || !repoName) {
                alert('请手工填写用户名和仓库名');
                return;
            }

            localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({ owner, repoName, branch, token }));

        }

        async function cloudDownloadAndMerge() {
            document.getElementById('cloudDropdown').classList.remove('open');
            const cfg = getCloudConfig();
            if (!cfg.owner || !cfg.repoName) {
                openCloudConfigModal();
                return;
            }

            const branch = cfg.branch || 'main';
            npStatus.innerText = "正在拉取云端配置...";

            try {
                const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repoName}/contents/${CLOUD_JSON_FILE}?ref=${encodeURIComponent(branch)}`;
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (cfg.token) headers['Authorization'] = `token ${cfg.token}`;

                const res = await fetch(apiUrl, { headers, cache: 'no-store' });
                let remoteList = [];

                if (res.status === 200) {
                    const data = await res.json();
                    const jsonStr = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
                    const parsed = JSON.parse(jsonStr);
                    if (Array.isArray(parsed)) remoteList = parsed;
                } else if (res.status === 404) {
                    const repoRes = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repoName}`, { headers, cache: 'no-store' });
                    if (!repoRes.ok) throw new Error(`找不到公开仓库 ${cfg.owner}/${cfg.repoName}`);
                    remoteList = [];
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }

                const mergedMap = new Map();
                [...favorites, ...remoteList].forEach(item => {
                    if (!item || !item.title) return;
                    const fp = getSongFingerprint(item.title, item.artist);
                    if (!mergedMap.has(fp)) {
                        mergedMap.set(fp, {
                            title: item.title,
                            artist: item.artist || '',
                            cover: item.cover || 'https://picsum.photos/seed/music/100/100',
                            sources: Array.isArray(item.sources) ? item.sources : [],
                            badgeText: item.badgeText || '⚡ 云同步源',
                            verifiedFull: true
                        });
                    } else {
                        const cur = mergedMap.get(fp);
                        if ((!cur.sources || !cur.sources.length) && item.sources && item.sources.length) {
                            cur.sources = item.sources;
                        }
                    }
                });

                favorites = Array.from(mergedMap.values());
                saveFavorites();
                if (currentTab === 'fav') {
                    viewList = [...favorites];
                    renderList();
                }

                setCloudLightStatus(true);
                hasCloudDownloadedAndMerged = true;
                document.getElementById('cloudUploadBtn').disabled = false;
                npStatus.innerText = `✅ 已同步 (${favorites.length} 首)`;
            } catch (err) {
                setCloudLightStatus(false);
                npStatus.innerText = `⚠️ 云连接失败`;
                alert(`云连接或下行失败：${err.message}`);
            }
        }

        async function cloudUploadJson() {
            document.getElementById('cloudDropdown').classList.remove('open');

            if (!hasCloudDownloadedAndMerged) {
                alert("请先点击「云下行」整合本地数据后，再执行云上传。");
                return;
            }

            const cfg = getCloudConfig();
            if (!cfg.owner || !cfg.repoName) {
                openCloudConfigModal();
                return;
            }

            const branch = cfg.branch || 'main';
            npStatus.innerText = "⬆️ 正在上传至公开仓...";

            try {
                const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repoName}/contents/${CLOUD_JSON_FILE}`;
                const headers = {
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };
                if (cfg.token) {
                    headers['Authorization'] = `token ${cfg.token}`;
                }

                let sha = undefined;
                const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers, cache: 'no-store' });
                if (getRes.status === 200) {
                    const getJson = await getRes.json();
                    sha = getJson.sha;
                }

                const cleanPayload = favorites.map(f => ({
                    title: f.title,
                    artist: f.artist,
                    cover: f.cover,
                    sources: (f.sources || []).map(s => ({ url: s.url, label: s.label })),
                    badgeText: f.badgeText
                }));

                const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(cleanPayload, null, 2))));
                const body = {
                    message: `Sync OneMusic favorites (${cleanPayload.length} songs)`,
                    content: contentBase64,
                    branch: branch
                };
                if (sha) body.sha = sha;

                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(body)
                });

                if (!putRes.ok) {
                    const errData = await putRes.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${putRes.status}`);
                }

                setCloudLightStatus(true);
                npStatus.innerText = `🎉 云上传成功 (${cleanPayload.length} 首)`;
                alert(`云上传成功！已同步 ${cleanPayload.length} 首收藏配置至 ${cfg.owner}/${cfg.repoName}`);
            } catch (err) {
                npStatus.innerText = `❌ 云上传失败`;
                alert(`云上传失败：${err.message}`);
            }
        }

        /* ================= 歌词解析与同步模块 ================= */
        function toggleLyricOverlay() {
            document.getElementById('lyricOverlay').classList.toggle('open');
        }

        function parseLrc(lrcText) {
            if (!lrcText || typeof lrcText !== 'string') return [];
            const lines = lrcText.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;

            for (let line of lines) {
                const text = line.replace(timeReg, '').trim();
                if (!text) continue;
                let match;
                timeReg.lastIndex = 0;
                while ((match = timeReg.exec(line)) !== null) {
                    const min = parseInt(match[1], 10);
                    const sec = parseInt(match[2], 10);
                    const ms = parseInt(match[3], 10) / (match[3].length === 3 ? 1000 : 100);
                    result.push({ time: min * 60 + sec + ms, text });
                }
            }
            return result.sort((a, b) => a.time - b.time);
        }

        async function fetchLyricsForSong(song, token) {
            currentLyrics = [];
            activeLyricIndex = -1;
            renderLyricsDOM([{ time: 0, text: `正在加载《${song.title}》歌词...` }]);

            const cleanTitle = song.title.replace(/\(.*?\)|（.*?）/g, '').trim();
            const cleanArtist = song.artist.split(/[\/&,、]/)[0].trim();
            const query = `${cleanTitle} ${cleanArtist}`.trim();

            try {
                const list = await requestMeting(`server=netease&type=search&id=${encodeURIComponent(query)}`, 4500);
                if (token !== activePlayToken) return;

                if (Array.isArray(list) && list.length > 0 && list[0].lrc) {
                    const res = await fetch(list[0].lrc);
                    const lrcStr = await res.text();
                    const parsed = parseLrc(lrcStr);
                    if (parsed.length > 0) {
                        currentLyrics = parsed;
                        renderLyricsDOM(currentLyrics);
                        return;
                    }
                }

                const lrcLibRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                if (lrcLibRes.ok) {
                    const lrcArr = await lrcLibRes.json();
                    if (Array.isArray(lrcArr) && lrcArr.length > 0 && lrcArr[0].syncedLyrics) {
                        const parsed = parseLrc(lrcArr[0].syncedLyrics);
                        if (parsed.length > 0) {
                            currentLyrics = parsed;
                            renderLyricsDOM(currentLyrics);
                            return;
                        }
                    }
                }
            } catch (e) {}

            if (token === activePlayToken && currentLyrics.length === 0) {
                renderLyricsDOM([
                    { time: 0, text: `${song.title} - ${song.artist}` },
                    { time: 2, text: "纯音乐或暂无时间轴歌词" }
                ]);
            }
        }

        function renderLyricsDOM(lines) {
            const box = document.getElementById('lyricScrollBox');
            box.innerHTML = '';
            lines.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `lyric-line ${idx === 0 ? 'active' : ''}`;
                div.innerText = item.text;
                div.onclick = () => {
                    if (audio.duration && item.time >= 0) {
                        audio.currentTime = item.time;
                    }
                };
                box.appendChild(div);
            });
        }

        function syncLyricProgress(currentTime) {
            if (!currentLyrics.length) return;
            let idx = 0;
            for (let i = 0; i < currentLyrics.length; i++) {
                if (currentTime >= currentLyrics[i].time) {
                    idx = i;
                } else {
                    break;
                }
            }
            if (idx !== activeLyricIndex) {
                activeLyricIndex = idx;
                const box = document.getElementById('lyricScrollBox');
                const nodes = box.querySelectorAll('.lyric-line');
                nodes.forEach((n, i) => n.classList.toggle('active', i === idx));
                if (nodes[idx]) {
                    nodes[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                if (currentLyrics[idx]) {
                    npStatus.innerText = `♪ ${currentLyrics[idx].text}`;
                }
            }
        }

        /* ================= Apple 官方直连采样器（无第三方代理） ================= */
        function parseAppleRssEntries(entries, badgeLabel) {
            if (!Array.isArray(entries) || entries.length === 0) return [];
            return entries.map(item => {
                const imgs = item['im:image'] || [];
                const rawCover = imgs.length ? imgs[imgs.length - 1].label : "https://picsum.photos/seed/music/300/300";
                return {
                    title: item['im:name'] ? item['im:name'].label : "未知歌曲",
                    artist: item['im:artist'] ? item['im:artist'].label : "未知歌手",
                    cover: rawCover.replace(/170x170/g, '300x300'),
                    sources: [],
                    badgeText: badgeLabel
                };
            });
        }

        function fetchAppleViaJsonp(region, badgeLabel) {
            return new Promise((resolve) => {
                const cbName = `appleRssCb_${region}_${Date.now()}`;
                const script = document.createElement('script');
                const timer = setTimeout(() => {
                    cleanup();
                    resolve([]);
                }, 6000);

                function cleanup() {
                    clearTimeout(timer);
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[cbName] = (data) => {
                    cleanup();
                    const entries = data && data.feed && data.feed.entry;
                    resolve(parseAppleRssEntries(entries, badgeLabel));
                };

                script.onerror = () => {
                    cleanup();
                    resolve([]);
                };

                script.src = `https://itunes.apple.com/${region}/rss/topsongs/limit=45/json?callback=${cbName}`;
                document.body.appendChild(script);
            });
        }

        async function fetchAppleOfficialChart(region, badgeLabel) {
            try {
                const url = `https://itunes.apple.com/${region}/rss/topsongs/limit=45/json`;
                const res = await fetch(url);
                if (res.ok) {
                    const json = await res.json();
                    const entries = json && json.feed && json.feed.entry;
                    const parsed = parseAppleRssEntries(entries, badgeLabel);
                    if (parsed.length > 0) return parsed;
                }
            } catch (e) {}

            const jsonpList = await fetchAppleViaJsonp(region, badgeLabel);
            if (jsonpList.length > 0) return jsonpList;

            return [];
        }

        async function doAggregatedSearch() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            document.getElementById('tab-search').style.display = 'inline-block';
            switchTab('search');

            songListEl.innerHTML = `<div style="text-align:center;padding:40px;color:var(--accent);">正在全网并发检索「${keyword}」...</div>`;

            const tasks = UPSTREAM_PLATFORMS.map(plat =>
                requestMeting(`server=${plat.code}&type=search&id=${encodeURIComponent(keyword)}`, 6000)
                    .then(list => ({ plat, list: list.slice(0, 15) }))
            );

            const settled = await Promise.allSettled(tasks);
            const mergedMap = new Map();

            settled.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value.list)) {
                    const { plat, list } = res.value;
                    list.forEach(item => {
                        const title = item.name || item.title || "未知歌曲";
                        const artist = item.artist || item.author || "未知歌手";
                        if (!item.url) return;

                        const fp = getSongFingerprint(title, artist);
                        if (!mergedMap.has(fp)) {
                            mergedMap.set(fp, {
                                title,
                                artist,
                                cover: item.pic || "https://picsum.photos/seed/music/300/300",
                                sources: [{ url: item.url, label: plat.label }],
                                labels: [plat.label]
                            });
                        } else {
                            const existing = mergedMap.get(fp);
                            if (!existing.labels.includes(plat.label)) {
                                existing.sources.push({ url: item.url, label: plat.label });
                                existing.labels.push(plat.label);
                            }
                            if (existing.cover.includes('picsum.photos') && item.pic) {
                                existing.cover = item.pic;
                            }
                        }
                    });
                }
            });

            searchResults = Array.from(mergedMap.values()).map(item => ({
                ...item,
                badgeText: `聚合 ${item.sources.length} 源`
            }));

            viewList = [...searchResults];
            renderList();
        }
